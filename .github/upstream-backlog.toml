status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "Upstream's `Channels::prunePeerChannels` removes every channel and send handler belonging to a peer no longer in the connected-peers list, called from `updateSessionPeers` whenever the peer set changes. This is already implemented in `Channels::prune_peer_channels` (`src/link_audio/channels.rs`), which retains only channels and send handlers whose peer id is still in the connected set, and it is already wired up exactly as upstream wires it: `AudioEngine::prune_peers` (`src/link_audio/engine.rs`), called from `update_session_peers_at` on every peer-sync tick, calls it with the current peer id list. This entry was left in the undifferentiated undecided block after the full LinkAudio port (PR #70) landed; retiring it here corrects the bookkeeping."
impact = "No user-visible effect from this reclassification: a peer that disconnects already stops being offered as a channel source today, and its stale send handler is already cleaned up. This entry only corrects the bookkeeping so the commit stops appearing as an open question."

[[port]]
id = "disable-linkaudio-when-link-is-disabled"
title = "Stop sharing audio while the Link session itself is turned off"
upstream = ["fcaefc6d3bec"]
rust = ["src/link_audio/api.rs", "src/link/controller.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "Upstream tracks `mIsLinkAudioEnabledByUser` (the application's request) separately from `mIsLinkAudioEffectivlyEnabled` (whether audio is actually running), and recomputes the latter from `mEnabled && mIsLinkAudioEnabledByUser` whenever either changes, so disabling Link stops audio even though the application never asked to turn it off, and re-enabling Link resumes it. Before this port, `LinkAudio::enable_link_audio` here started the peer-sync task unconditionally on request, with no reference to `BasicLink::is_enabled()`, and `LinkAudio` had no `enable`/`disable` overrides at all - it relied entirely on `Deref`/`DerefMut` to `BasicLink`, so calling `link_audio_instance.disable()` disabled Link Classic discovery/dispatch but left any already-running audio-sharing task untouched. Ported: `LinkAudio` now tracks `audio_enabled_by_user` (the request) separately from whether the peer-sync task is actually running, recomputed by `update_is_link_audio_enabled` from `audio_enabled_by_user && self.link.is_enabled()`. `LinkAudio` gained inherent `enable`/`disable` that delegate to the inner `BasicLink` and drive that recompute, so requesting audio sharing before Link is enabled defers it and disabling Link stops it until Link is re-enabled. Three review findings shaped the final shape and are part of this item rather than incidental to it. First, `LinkAudio`'s `DerefMut` to `BasicLink` is removed: while it existed the invariant was only advisory, since any caller holding `&mut LinkAudio` could reach `BasicLink::disable` directly and disable Link with the peer-sync task and announced endpoint still live. The `&mut self` surface of `BasicLink` (`enable_start_stop_sync`, `commit_app_session_state` and the four callback setters) is forwarded explicitly instead; `Deref` is kept, so the read-only API is unchanged. Second, teardown is now cancellation-safe: `BasicLink::disable` publishes its disabled state before its first await precisely so a dropped future cannot leave Link half-disabled, so audio teardown was moved to the same side of that await via a synchronous, idempotent `stop_audio_sharing` that leaves `audio_enabled_by_user` intact for a later resume. Third, `Controller::set_audio_endpoint` now takes the peer-state lock rather than skipping the write on contention: every other accessor on that mutex is a read, where a skip costs one stale answer, but this one is a state transition, and a dropped withdrawal would leave the peer-sync task stopped while peers still saw the endpoint announced, with no later call to correct it."
impact = "An application that turned audio sharing on before enabling Link, or that disabled Link mid-session after a dropout or a pause, kept announcing its audio endpoint against a session that was no longer discoverable, so peers saw a stale, unreachable endpoint. Audio sharing now follows Link's own enabled state, and stops even if the caller abandons the disable operation partway. Code that reached the mutable side of the plain Link API by dereferencing the audio type must now call those methods on the audio type instead."

