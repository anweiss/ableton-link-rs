[[port]]
id = "fix-rare-crash-during-initialization-callbackdispatcher-ordering"
title = "Make shutdown deterministic so no callback fires once teardown has begun"
upstream = ["57b77a8040d3", "44d78f2cf3a4"]
rust = ["src/link/controller.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "The `RtClientStateSetter`/`CallbackDispatcher` UB fix landed; the follow-up commits add an explicit `start()`/`stop()` pair (`RtClientStateDispatcher`) so shutdown is deterministic. Ported here as `DispatchGate`: disable stops measurement intake and discovery, then closes and drains controller dispatch, so no admitted dispatch work runs once disable returns."
impact = "Callbacks could still be delivered while the object owning them was being taken apart, which showed up as a rare crash around startup and shutdown. Disabling now quiesces measurement intake, discovery, and controller dispatch before resetting peers; re-enabling prepares those stages before reopening admission."
note = "`5bf14d95471d` retired (ported, see issue #71); `57b77a8040d3`/`44d78f2cf3a4` ported through Controller's DispatchGate. disable() publishes disabled, stops measurement intake, stops discovery, then closes controller dispatch and waits for its in-flight permits. Blocked downstream sends cancel when their gate closes. Issue #149 retains the measurement-result consumer and owned broadcaster for reuse. enable() quiesces any interrupted transition, resets state and peer counts while disabled, and starts measurement intake and core dispatch before the final discovery barrier. Discovery receivers keep draining through preparation; after all acknowledgements, the final transition drains queued datagrams, publishes enabled, and opens discovery admission without an await between those operations. Registration is serialized with this transition. Draining after opening would erase freshly queued results. Each reopening increments the epoch used to discard deferred state from a previous lifecycle. Enabling an already-enabled instance does not reset the session. Enabled publication uses a blocking, poison-recovering lock rather than best-effort try_lock. Final drop, not temporary disable, cancels owned tasks; PR #163 additionally joins the owned executor to finish core quiescence. The pin remains unchanged."

[[port]]
id = "sessioncontroller-shutdown-ordering-improvements"
title = "Finish the shutdown-ordering work on the core and its callback dispatcher"
upstream = ["cccaecc9e93b", "53f0627c9cf8", "eb25bb250f2f", "7f222b559678"]
rust = ["src/link/controller.rs", "src/link_audio/api.rs", "src/link_audio/engine.rs"]
