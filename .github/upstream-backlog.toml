# Canonical porting backlog for the vendored Ableton Link submodule.
#
# This file, not a GitHub issue, is the backlog. It is reviewed through pull
# requests like any other source file, so a change to it has an author, a diff
# and a review, and cannot be silently overwritten by an agent or a passing
# click on a checkbox.
#
# It is NOT the source of truth for what is outstanding. The submodule pin at
# vendor/ableton-link is the watermark: a commit at or before the pin is
# reconciled no matter what this file claims. This file records intent,
# triage and metadata. Where the two can disagree,
# .github/scripts/validate-upstream-backlog.py is what catches it.
#
# Validate:  python3 .github/scripts/validate-upstream-backlog.py

schema_version = 1

# What this file can and cannot prove
# ===================================
# `.github/scripts/validate-upstream-backlog.py` runs on every pull request and
# proves the *accounting*: that no upstream commit in the drift range is missing,
# that the pin here matches the real gitlink, that outstanding items are in
# ancestry order, and — the one that matters most — that a change advancing the
# submodule pin does not cross a commit still marked outstanding or undecided.
# That last check is what PR #59 needed and did not have: it advanced the pin to
# upstream position 8 with positions 1-7 untouched, which would have silently
# retired a crash fix.
#
# It cannot prove that work marked `retired` was actually done. A pull request
# that flips an item to `retired` and advances the pin in the same commit is
# self-consistent whether or not any Rust was written. That is what the PR body's
# Watermark section and human review are for. The validator narrows the failure
# mode from "silent" to "visible in a diff someone has to approve"; it does not
# eliminate it.

# Watermark this triage was computed against. Advisory: the real watermark is
# the submodule pin, and the validator fails if this drifts from it.
[watermark]
pinned = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
upstream = "902aef95bf94af49746fdda5369b42cdcfa1e6d2"
commits_behind = 113

# ---------------------------------------------------------------------------
# Port items, in upstream ancestry order (oldest first). The port workflow
# takes the earliest outstanding item and advances a monotonic watermark, so
# this order is load-bearing: do not reorder by theme.
# ---------------------------------------------------------------------------

