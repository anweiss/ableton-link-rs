why = "The `RtClientStateSetter`/`CallbackDispatcher` UB fix landed; the follow-up commits add an explicit `start()`/`stop()` pair (`RtClientStateDispatcher`) to make shutdown deterministic and still need porting"
note = "`5bf14d95471d` retired (ported, see issue #71); `57b77a8040d3`/`44d78f2cf3a4` ported: `Controller` holds an `Arc<DispatchGate>` that the join-session and peer-state-change loops pass every batch through, and `disable()` closes and drains that gate before any other teardown, mirroring upstream's `mRtClientStateSetter.stop()` ordering. The loops themselves stay alive for the process lifetime so `enable()` can reopen the gate and resume dispatching; the gate carries a generation counter bumped by each `stop()` so a batch received before a shutdown cannot be admitted after a later restart. An earlier revision of this port aborted the loops' `JoinHandle`s instead, which broke disable/re-enable; review replaced it with the gate. `retired_at_pin` is left at the unchanged pin because `increase-thread-priority-on-link-io-thread` (blocked_on) is still outstanding and precedes this item in ancestry, so the submodule pin itself was not advanced."

