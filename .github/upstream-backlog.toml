[[port]]
id = "increase-thread-priority-on-link-io-thread"
title = "Run time-critical clock work at raised scheduler priority"
upstream = ["7418012c2b2a", "eefe514d1846"]
rust = ["src/platform/thread.rs"]
risk = "behavior"
status = "outstanding"
retired_at_pin = ""
blocked_on = "Whether this crate should own its execution context. Upstream raises the priority of a thread it owns, reached through `callOnLinkThread`; this port has no owned thread at all — every Link task is a bare `tokio::spawn` onto the caller's ambient runtime, across 30+ sites in `src/discovery/` and `src/link/`. Boosting a shared Tokio worker would boost unrelated caller tasks, so there is nothing correct to raise. Closing this needs a decision on giving the crate its own runtime (e.g. built with `on_thread_start`), which is an architectural change across many files, not a transliteration. Until that is decided the port agent skips this item and works the ones behind it; the watermark still stops here."
why = "Adds `platform::ThreadPriority` so a thread driving time-critical Link work can request `SCHED_FIFO`/high-priority scheduling; improves clock-sync quality under load. Upstream calls it only from its `linkaudiohut` example, via `callOnLinkThread`, never from the library itself."
impact = "Clock synchronisation degrades when the work driving it competes with ordinary threads on a busy machine, which listeners hear as drift between peers. Upstream lets that work ask the operating system for real-time scheduling. The ability to make the request exists here, but nothing in this library yet owns a thread to apply it to, so the benefit is not yet realised."
note = "Partially ported; deliberately left outstanding. Done: `platform::ThreadPriority` (`set_high`/`reset`) exists as public API, mirroring upstream's capture/restore shape from `eefe514d1846` rather than the stateless functor from `7418012c2b2a`, implemented over the `audio_thread_priority` crate rather than hand-rolled FFI so the port carries no `unsafe`; see `src/platform/thread.rs` for the three documented deviations from upstream's raw parameters. Not done, and the reason this stays outstanding: nothing raises the priority of this port's Link IO execution, which is what the title claims. Upstream reaches its IO thread through `callOnLinkThread`; this port has no equivalent, because every Link task is a bare `tokio::spawn` onto the caller's ambient runtime (30+ sites across `src/discovery/` and `src/link/`). There is therefore no thread this crate owns and may boost, and raising a shared Tokio worker would boost unrelated caller tasks. Retiring on the API alone would assert a behaviour change that does not happen. Closing this needs an execution hook — e.g. the crate owning a runtime built with `on_thread_start` — which is a design change rather than a transliteration and should be scoped as its own item. Note also that the watermark cannot advance past `7418012c2b2a` yet: `90d6b7c2d3e3` and 19 other still-undecided commits sit between it and the pin in ancestry order."

