status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "Moves shutdown into the SessionController destructor before base-class teardown; makes dispatcher stop idempotent and re-checks callback admission after waking; stops LinkAudio before core IO shutdown; removes nullable-controller checks which have no Rust analogue."
impact = "Dropping the core now closes callback admission and waits for its execution thread, including any already-running callback, before releasing its fields. Queued callbacks do not start after the close boundary. Callback-initiated teardown cannot join itself, so an owned join service waits for that one invocation to return; subsequent invocations are rejected. The audio extension still stops before its core."
note = "Completed in PR #163 with Controller::drop and the owned IoContext. External drop synchronously joins runtime destruction instead of treating abort as completion; repeated shutdown is harmless. Managed callback-entry checks define admission independently of the longer dispatch permit. Reentrant drop transfers the IO JoinHandle to a retained process-wide service, never self-joins or detaches cleanup; the current invocation alone may return after drop. Barrier/channel regressions cover running and queued callbacks, contention, current-thread/multithread caller runtimes, callback-initiated drop, task cleanup, and restart. Tempo notification dispatch releases state locks and suppresses overtaken values after acquiring its callback mutex. LinkAudio-before-core ordering and all #149 restart gates remain intact. Synchronous app callbacks and standalone helpers retain their caller-owned execution contract; callbacks must not block on their own executor or on application locks held across external drop. See docs/execution-lifecycle.md. The upstream pin remains unchanged."

[[port]]
id = "fix-use-after-move-in-peers-sawpeerongateway"
title = "Audit peer bookkeeping for values read after ownership was given away"
upstream = ["ef2d1fd99d70", "f5fabf4ac8be"]
rust = ["src/discovery/peers.rs"]
risk = "internal"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "`std::move` on a value that was then read again; Rust's borrow checker would normally catch this at compile time, but the equivalent logic in `peers.rs` should be audited for correctness Also covers: `PeerState::fromPayload` initializer list was missing the third field after `audioEndpoint` was added; also fixes use-after-move in `Peers::GatewayObserver`"
impact = "Upstream read two values after handing ownership of them elsewhere, and separately left a field unset when the audio address was introduced. This language rejects the first class of mistake at compile time, so the work here is an audit rather than a fix: confirm the equivalent peer bookkeeping is correct and that no field was missed."
note = "Merged with \"Fix ESP-IDF 6.0 PeerState init + Peers use-after-move (core portions)\" on migration: both claimed f5fabf4ac8be. Audited `saw_peer`/`peer_left`/`GatewayObserver` in `src/discovery/peers.rs`: neither upstream mistake has a Rust equivalent. `ef2d1fd99d70`'s `make_pair(std::move(peerState), std::move(gatewayAddr))`-then-read bug has no analogue because `saw_peer` never moves `peer_seen_peer_state` before reading from it — it destructures into a fresh `PeerState` (`ps`) up front and reads only from `ps`/its derived locals afterward, and the peer list update clones (`peer.clone()`) rather than moving. `f5fabf4ac8be`'s two core-portion bugs are likewise absent: `PeerState` here has all three fields (`node_state`, `measurement_endpoint`, `audio_endpoint`) populated in every construction site, so the missing-third-field initializer bug is not representable, and `GatewayObserver`'s callback dispatch (`peer_event` match arms in `GatewayObserver::new`) reads `peer_state`/`node_id` by value from the channel and never touches them again afterward, so there is no post-move read to fix. The ESP-IDF-specific `esp_netif_next` → `esp_netif_next_unsafe`/`esp_netif_tcpip_exec` portion of `f5fabf4ac8be` has no analogue here. This port does scan interfaces for discovery — `src/platform/network.rs`, called from `src/discovery/messenger.rs` — but it does so through the cross-platform `network-interface` crate with an `if-addrs` fallback, and makes no direct `esp_netif` calls anywhere, so there is no ESP-IDF interface enumeration to make thread-safe. This entry is bookkeeping only; no Rust change was needed."

[[port]]
id = "set-ip-multicast-all-0-on-linux"
title = "Stop handing discovery sockets multicast traffic for groups they never joined on Linux"
upstream = ["c5574eee4d03", "d466f42a7b36"]
rust = ["src/discovery/messenger.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "`IP_MULTICAST_ALL=0` narrows delivery to the groups a socket joined itself on Linux, instead of every group joined anywhere on the system; the subnet filter in `UdpMessenger` that approximated this at the application layer is then removed. It is a per-socket membership filter, not per-interface arrival metadata: it does not report which interface a datagram came in on, so response-socket selection stays a longest-prefix match on the source address, as upstream's does. This port never had the subnet-filter workaround, so only the additive half applies. Note also that this port's listener joins the group on every interface, so the option excludes other groups rather than other interfaces; the interface-identity gap that leaves is tracked in issue #154, not here."
impact = "By default Linux hands a socket every multicast datagram for any group joined anywhere on the machine, including groups that socket never joined. Anything else that binds the discovery port and joins a group of its own therefore has its traffic parsed and thrown away by discovery. Asking the operating system for only this socket's own memberships stops that. Other Link instances join the same group, so their packets keep arriving as they should, and nothing changes about which interface a peer looks reachable through."

