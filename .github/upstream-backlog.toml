[[port]]
id = "increase-thread-priority-on-link-io-thread"
title = "Run time-critical clock work at raised scheduler priority"
upstream = ["7418012c2b2a", "eefe514d1846"]
rust = ["src/platform/thread.rs", "src/platform/io_context.rs", "src/link/controller.rs", "src/link/mod.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "Adds `platform::ThreadPriority` so a thread driving time-critical Link work can request `SCHED_FIFO`/high-priority scheduling; improves clock-sync quality under load. Upstream calls it only from its `linkaudiohut` example, via `callOnLinkThread`, never from the library itself."
impact = "Applications can now request real-time scheduling for the thread actually driving Link discovery, clock measurement and background callbacks, without boosting unrelated tasks in their own runtime. Ordinary scheduling remains the default and a denied request is reported. This is a scheduling capability, not a measured reduction in clock drift."
note = "Completed in PR #163. Controller constructs its network resources and background tasks on an owned current-thread Tokio runtime; descendants inherit that executor and the late discovery listener explicitly uses its retained handle. BasicLink::set_io_thread_priority sends the request there, with same-thread restoration on reset/shutdown/unwind. The example opts in with LINK_IO_REALTIME=1, preserving upstream's opt-in behavior. Safe audio_thread_priority parameter deviations remain documented in src/platform/thread.rs. Tests exercise owned/descendant identity, native request/reset, error propagation, repeat shutdown, cleanup, and loopback traffic. CI executes Linux/macOS/Windows scheduling and serial lifecycle tests; Linux additionally requires promotion in a privileged disposable process. See docs/execution-lifecycle.md for the callback, cancellation and process-lifetime join-service contract. No measured timing improvement is claimed; the upstream pin is unchanged."

