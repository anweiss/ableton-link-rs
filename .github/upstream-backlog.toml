risk = "behavior"
status = "retired"
retired_at_pin = "e233c676"
why = "Assertion was off-by-one and could fire on valid maximum-size messages; Tokio path should be checked for equivalent over-size guard"
impact = "An off-by-one in the size check treated a message occupying the full allowed payload as oversized and aborted the process in debug builds. Entirely valid traffic from a peer advertising a lot of state could therefore take down a listener."
note = "retired at pin `e233c676`"

