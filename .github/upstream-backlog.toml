[[port]]
id = "fix-rare-crash-during-initialization-callbackdispatcher-ordering"
title = "Make shutdown deterministic so no callback fires once teardown has begun"
upstream = ["57b77a8040d3", "44d78f2cf3a4"]
rust = ["src/link/controller.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "The `RtClientStateSetter`/`CallbackDispatcher` UB fix landed; the follow-up commits add an explicit `start()`/`stop()` pair (`RtClientStateDispatcher`) so shutdown is deterministic. Ported here as `DispatchGate`: `disable()` closes and drains it before any other teardown, so no dispatch work runs once `disable()` returns."
impact = "Callbacks could still be delivered while the object owning them was being taken apart, which showed up as a rare crash around startup and shutdown. Disabling now closes and drains the path callbacks travel along before anything else is dismantled, and re-enabling reopens it cleanly, so work queued in one lifecycle cannot leak into the next."
note = "`5bf14d95471d` retired (ported, see issue #71); `57b77a8040d3`/`44d78f2cf3a4` ported: `Controller` holds an `Arc<DispatchGate>` that the join-session and peer-state-change loops pass every batch through, and `disable()` closes and drains that gate before any other teardown, mirroring upstream's `mRtClientStateSetter.stop()` ordering. The loops themselves stay alive for the process lifetime so `enable()` can reopen the gate and resume dispatching; each loop holds its gate permit across its own `recv()` and discards whatever its channel still holds when the gate closes, so `stop()` returning means the pre-shutdown queue contents are gone and no work produced in one lifecycle can be dispatched into the next. The gate starts closed, matching `enabled == false` at construction, so no dispatch runs before the first `enable()`; and each `start()` bumps a gate epoch that per-loop state living outside the channels (the deferred audio-endpoint edge) is stamped with, so state held from a torn-down lifecycle is discarded rather than released into the next one. `enable()`/`disable()` set the `enabled` flag under a blocking lock before/after moving the gate, so the two lifecycle controls cannot diverge under contention. An earlier revision of this port aborted the loops' `JoinHandle`s instead, which broke disable/re-enable; review replaced it with the gate. `retired_at_pin` is left at the unchanged pin because `increase-thread-priority-on-link-io-thread` (blocked_on) is still outstanding and precedes this item in ancestry, so the submodule pin itself was not advanced."

[[port]]
id = "sessioncontroller-shutdown-ordering-improvements"
title = "Finish the shutdown-ordering work on the core and its callback dispatcher"
upstream = ["cccaecc9e93b", "53f0627c9cf8", "eb25bb250f2f", "7f222b559678"]
rust = ["src/link/controller.rs", "src/link_audio/api.rs", "src/link_audio/engine.rs"]
risk = "behavior"
status = "outstanding"
retired_at_pin = ""
why = "Moves `shutdown()` (renamed from `stopIoService()`) into `~SessionController()` so it runs before base-class teardown; makes `LockFreeCallbackDispatcher::stop()` idempotent and re-checks `mRunning` after waking so no callback fires after stop is requested; has LinkAudio's own `~SessionController` call `stopAudio()` via the IO thread before `this->shutdown()`; and removes now-unnecessary `mpSessionController` null checks. The LinkAudio shutdown-ordering half of the behavior was already addressed in Rust by the sibling `route-callbacks-through-sessioncontroller-shutdown-ordering-improvements` item's `LinkAudio::Drop` change, but the `Controller`/dispatcher half (`shutdown()` rename/move, `LockFreeCallbackDispatcher::stop()` idempotency) still needs a Rust equivalent."
impact = "Half of upstream's shutdown rework is already reflected here: the audio extension stops before the core it depends on. The remaining half is the core itself, where asking it to stop twice should be harmless and no callback should be delivered after a stop has been requested. Until that lands, tearing down under load can still deliver a callback that was already meant to be cancelled."

[[port]]
id = "fix-use-after-move-in-peers-sawpeerongateway"
title = "Audit peer bookkeeping for values read after ownership was given away"
upstream = ["ef2d1fd99d70", "f5fabf4ac8be"]
