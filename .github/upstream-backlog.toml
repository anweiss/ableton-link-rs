[[port]]
id = "set-ip-multicast-all-0-on-linux"
title = "Stop handing discovery sockets multicast traffic for groups they never joined on Linux"
upstream = ["c5574eee4d03", "d466f42a7b36"]
rust = ["src/discovery/messenger.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "`IP_MULTICAST_ALL=0` narrows delivery to the groups a socket joined itself on Linux, instead of every group joined anywhere on the system; the subnet filter in `UdpMessenger` that approximated this at the application layer is then removed. It is a per-socket membership filter, not per-interface arrival metadata: it does not report which interface a datagram came in on, so response-socket selection stays a longest-prefix match on the source address, as upstream's does. This port never had the subnet-filter workaround, so only the additive half applies. Note also that this port's listener joins the group on every interface, so the option excludes other groups rather than other interfaces; the interface-identity gap that leaves is tracked in issue #154, not here."
impact = "By default Linux hands a socket every multicast datagram for any group joined anywhere on the machine, including groups that socket never joined. The discovery listener shares its port with other Link instances and with anything else that binds it, so their traffic lands in the discovery receive path to be parsed and thrown away. Asking the operating system for only this socket's own memberships stops that. It filters by group rather than by network interface, so it does not change which interface a peer looks reachable through."

[[port]]
id = "catch-message-encode-exceptions-in-sendudpmessage"
title = "Handle a message too large to encode instead of failing hard"
upstream = ["e9a2e414d63f"]
rust = ["src/discovery/messenger.rs", "src/discovery/messages.rs", "src/encoding.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "334972b404d7e8801e921cdc9d4b7e38b702f80a"
why = "`encodeMessage` is now inside the `try` block so encoding errors (e.g. oversized payload) are caught and logged instead of propagating; previously only the `send()` call was guarded. Ported: `encode_message` now returns `EncodeError::MessageTooLarge` (an additive variant on the already-`non_exhaustive` `EncodeError`, so the public `Error` enum is unchanged) instead of panicking, and `send_message` logs and returns `Ok(())` on that error instead of unwrapping. The submodule pin was not advanced past this commit because several outstanding backlog items (e.g. `have-peers-notify-on-audioendpoint-changes`, `increase-thread-priority-on-link-io-thread`) sit earlier in upstream ancestry and remain unaudited."
impact = "Only the send itself was protected against failure, not the step that builds the packet. A peer state too large to fit in one packet - many advertised addresses, a long name - would therefore abort the process rather than being logged and dropped."

