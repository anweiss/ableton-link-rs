[[port]]
id = "route-callbacks-through-sessioncontroller-shutdown-ordering-improvements"
title = "Shut the audio extension down before the core it depends on"
upstream = ["165c764990b0", "cbc81f057633", "fd30b5048e20"]
rust = ["src/link_audio/api.rs"]
risk = "behavior"
status = "retired"
retired_at_pin = "fd30b5048e20136b71046f7dad8a2c29bcd46892"
why = "Extracts a `SessionController` type that owns callback-routing so callbacks fired during/after partial destruction become safe no-ops, and an `ApiConfig` template split so a differently-shaped controller (channels/audio) can share `Controller`. Rust's ownership model has no raw-pointer-nulling equivalent, and `ApiConfig`'s template split has no analogue since Rust's `AudioEngine` is a separate type composed alongside `BasicLink` rather than a template parameter of `Controller`, so the only observable behavior change ported here is the shutdown-ordering guarantee: `LinkAudio`'s `Drop` impl now explicitly withdraws the audio endpoint, clears session peers, and aborts the peer-sync task *before* `BasicLink`/`Controller` is dropped, rather than relying on struct field drop order (which would have dropped `link` first, backwards from upstream's intent)."
impact = "Teardown relied on the order fields happened to be declared in, which was the reverse of what upstream intends: the core could be dismantled while the audio extension was still announcing itself and still referring to it. Shutdown is now explicit and ordered, so a callback arriving mid-teardown can no longer reach a half-destroyed object."

