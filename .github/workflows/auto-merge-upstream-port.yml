name: Auto-merge upstream port PRs

# Why this workflow exists
# ========================
# `Link Upstream Port` (link-upstream-port.md) opens exactly one pull request per
# run, and then refuses to open another until that PR is merged. So an unattended
# port PR does not just sit there: it halts the whole porting pipeline. This
# workflow closes that loop by putting qualifying port PRs into GitHub's native
# auto-merge queue, so they land on their own once every required check on `main`
# has passed.
#
# What this does NOT do
# =====================
# It does not bypass, weaken, or approve anything. Auto-merge is GitHub's own
# mechanism: the PR merges only when branch protection on `main` is fully
# satisfied. If a check fails, the PR stays open exactly as it does today.
#
# Why the labels are NOT tested in the job-level `if`
# ==================================================
# They arrive too late. On PR #76 the pull request was created at 15:13:00Z and
# its labels were applied at 15:13:01Z and 15:13:02Z — one to two seconds later.
# A job-level `contains(...labels...)` guard therefore evaluates an `opened`
# payload that has no labels yet, skips the job, and the careful re-read below
# never runs. The event payload is used only for a cheap author/base/fork guard;
# every real qualification decision is made against a freshly fetched PR, with a
# short poll to absorb that race.
#
# Wire-format changes are deliberately excluded
# =============================================
# `link-upstream-port.md` instructs the agent to tag anything touching the
# on-the-wire modules as `risk: wire-format` because those "change bytes on the
# network and need a human before they ship". `main` requires zero approving
# reviews, so auto-merge would be the only thing standing between such a change
# and `main`. This workflow refuses to queue those PRs and says so on the PR.
#
# That check reads the PR body, which is prose written by an agent. Prose is not
# trustworthy enough to *grant* an exemption, but it is fine to *withhold* one:
# the check fails closed. A body the agent malformed, or a match on an unrelated
# mention of the phrase, costs a human merge click — never an unreviewed merge.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled, synchronize]
  # A merge to `main` can leave an already-queued port PR out of date, and
  # `main` requires branches to be up to date (`strict: true`). Re-examine open
  # port PRs whenever `main` moves so that situation is reported rather than
  # silently stalling the pipeline.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed for the merge itself, not for anything this workflow calls. Every
  # port pull request carries `Closes #NNN` for its `[[port]]` item's tracking
  # issue, and GitHub closes a linked issue as the merging actor, using the
  # merging token's permissions. Without `issues: write` the merge succeeds and
  # the linked issue is left open, silently - which is how #104 and #105
  # survived their own ports.
  issues: write

concurrency:
  group: auto-merge-upstream-port-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Cheap guard only. For pull_request events, drop anything that obviously is
    # not a bot PR from this repository. Labels are NOT tested here (see above).
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'github-actions[bot]'
      )
    steps:
      - name: Enable auto-merge for qualifying port PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const labelsOf = pr => pr.labels.map(l => l.name);
            // Applied by gh-aw's threat detection. In warn mode gh-aw publishes
            // the pull request anyway and asks in the body for manual review
            // "before any follow-up automation" - and this workflow is the last
            // piece of automation before `main`.
            const THREAT_LABEL = 'agentic-threat-detected';

            // Labels are applied a second or two after the PR is created, so a
            // single read of an `opened` event races them. Poll briefly.
            async function fetchQualifying(number) {
              const attempts = 6;
              let pr;
              for (let i = 0; i < attempts; i++) {
                ({ data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: number,
                }));
                if (labelsOf(pr).includes('upstream-sync')) break;
                if (i < attempts - 1) await sleep(5000);
              }
              return pr;
            }

            const THREAT_HOLD = {
              marker: '<!-- auto-merge-upstream-port: threat-hold -->',
              body:
                '**Auto-merge withheld.** gh-aw\'s threat detection ' +
                'flagged this pull request (`agentic-threat-detected`), and its ' +
                'own banner requires manual review before any follow-up ' +
                'automation. `main` requires zero approving reviews, so ' +
                'auto-merging it would put flagged agent output on `main` ' +
                'with no human having read it.\n\nRead the detection ' +
                'result in the generating workflow run. If it is a false ' +
                'positive, remove the label; otherwise close this pull ' +
                'request.',
            };
            const WIRE_HOLD = {
              marker: '<!-- auto-merge-upstream-port: wire-format-hold -->',
              body:
                '**Auto-merge withheld.** This port is tagged ' +
                '`risk: wire-format`, meaning it changes bytes on the ' +
                'network. `main` requires zero approving reviews, so ' +
                'auto-merging it would put a protocol change on `main` ' +
                'with no human having read it.\n\nReview it and merge by ' +
                'hand.',
            };

            // Posts once per pull request. The marker is the idempotency key,
            // so a hold reached twice - by two triggers, or by the late check
            // at the merge boundary - says it once.
            async function postHold(number, hold) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              if (comments.some(c => c.body && c.body.includes(hold.marker))) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `${hold.marker}\n${hold.body}`,
              });
            }

            function disqualify(pr, wire) {
              const labels = labelsOf(pr);
              if (pr.state !== 'open') return `state is ${pr.state}`;
              if (pr.base.ref !== 'main') return `base is ${pr.base.ref}`;
              if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
                return 'head branch is not in this repository';
              }
              if (pr.user.login !== 'github-actions[bot]') {
                return `author is ${pr.user.login}`;
              }
              // No branch-name check. The port workflow's branch name is chosen
              // by the model per run, not fixed by link-upstream-port.md: #69,
              // #76 and #83 happened to use `port/`, but #86 used
              // `chore/advance-submodule-...` and was skipped entirely. The
              // `upstream-sync` + `automation` label pair below is the actual
              // contract, and it is applied only by the port workflow.
              if (!labels.includes('upstream-sync') || !labels.includes('automation')) {
                return `labels are [${labels.join(', ')}]`;
              }
              if (labels.includes('autorelease: pending')) return 'it is a release PR';
              // Ahead of the wire-format check, and for the same reason that
              // one sits ahead of `copilot-reviewed`: whichever rejection is
              // reported is the only one that gets a hold comment, so the more
              // urgent has to win. Threat detection flagging the agent's own
              // output is more urgent than the patch touching wire modules.
              if (labels.includes(THREAT_LABEL)) {
                return 'it is flagged by threat detection and needs a human reviewer';
              }
              if (wire) {
                return 'it is tagged risk: wire-format and needs a human reviewer';
              }
              // Nothing in branch protection makes a port PR wait for review:
              // Copilot only ever leaves a COMMENT review, which does not block
              // merging, and `main` requires zero approving reviews. Without
              // this label the PR would merge the instant the 15 checks went
              // green, usually before Copilot had looked at it. The label is
              // applied by copilot-review-loop.yml when the review-and-fix loop
              // finishes, and is withheld when it stalls, so a broken loop
              // parks the PR instead of merging it unreviewed.
              //
              // It is tested AFTER the wire-format check on purpose. A
              // wire-format PR never earns the label, so testing it first would
              // shadow the wire-format branch below and the hold comment - the
              // one rejection a human must be told about - would never be
              // posted.
              if (!labels.includes('copilot-reviewed')) {
                return 'the Copilot review loop has not completed (no copilot-reviewed label)';
              }
              return null;
            }

            // The `copilot-reviewed` label says a sign-off happened; it does not
            // say WHICH commit was signed off. copilot-review-loop.yml records
            // that in a state comment on the PR. Both workflows fire on the same
            // `synchronize`, so relying on the label alone allows this race: this
            // workflow qualifies the new head while the stale label is still
            // present, the review loop then revokes it, and this workflow
            // re-enables auto-merge on a head nobody reviewed. Checking the SHA
            // closes that, and fails closed if the state cannot be read.
            const STATE_MARKER = '<!-- copilot-review-loop:state -->';

            async function signedOffSha(number) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              const found = comments.find(
                c => (c.body || '').includes(STATE_MARKER) &&
                     c.user && c.user.login === 'github-actions[bot]',
              );
              if (!found) return null;
              const match = /```json\n([\s\S]*?)\n```/.exec(found.body || '');
              if (!match) return null;
              try {
                return JSON.parse(match[1]).reviewedSha || null;
              } catch (err) {
                return null;
              }
            }

            async function disableAutoMerge(pr) {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                   repository(owner: $owner, name: $repo) {
                     pullRequest(number: $number) { autoMergeRequest { enabledAt } }
                   }
                 }`,
                { owner, repo, number: pr.number }
              );
              if (!repository.pullRequest.autoMergeRequest) return;
              await github.graphql(
                `mutation($id: ID!) {
                   disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                     pullRequest { number }
                   }
                 }`,
                { id: pr.node_id }
              );
              core.notice(`PR #${pr.number}: auto-merge disarmed.`);
            }

            // The body tag is agent-written prose, so it is a fail-closed hint,
            // not the source of truth. The authoritative signal is the file
            // list: link-upstream-port.md names these as the paths that "move
            // bytes on a live network shared with Ableton Live, Bitwig, and
            // hardware". A PR that started as an ordinary port can acquire one
            // of them from a later commit without the body ever saying so.
            const WIRE_FORMAT_PATHS = [
              'src/discovery/messages.rs',
              'src/link/payload.rs',
              'src/link/audio_endpoint.rs',
              'src/encoding.rs',
              'src/link_audio/messages.rs',
              'src/link_audio/payload.rs',
              'src/link_audio/encoding.rs',
              'src/link_audio/codec.rs',
            ];

            async function isWireFormat(pr) {
              if (/risk:\s*wire-format/i.test(pr.body || '')) return true;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              return files.some(f => WIRE_FORMAT_PATHS.includes(f.filename));
            }

            async function revoke(pr) {
              await disableAutoMerge(pr);
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name: 'copilot-reviewed',
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            async function process(number) {
              const pr = await fetchQualifying(number);
              // Threat is settled from labels alone, before any further API
              // call. `isWireFormat` queries the file list, and a failure there
              // throws out of `process` before `revoke` ever runs - which on a
              // flagged pull request would leave an already-armed auto-merge
              // request armed. This workflow is not a required check, so its
              // own failure holds nothing back. Deciding the flagged case from
              // data already in hand removes that dependency entirely.
              //
              // `wire` is left false for a flagged pull request: `disqualify`
              // reports the threat ahead of wire-format anyway, so the value is
              // never read, and computing it would reintroduce the API call
              // this ordering exists to avoid.
              const threat = labelsOf(pr).includes(THREAT_LABEL);
              const wire = threat ? false : await isWireFormat(pr);
              const reason = disqualify(pr, wire);
              if (reason) {
                core.info(`PR #${number} does not qualify: ${reason}. Doing nothing.`);
                // The two rejections a human must know about, because the PR
                // will otherwise sit waiting on nobody. Both revoke rather than
                // merely decline: the label or tag can arrive *after* a
                // sign-off, and an auto-merge request already enabled stays
                // armed regardless. Doing this here as well as in the review
                // loop means this workflow fails closed on its own, without
                // depending on the other one having run - which matters
                // especially for the threat label, since `labeled` is one of
                // this workflow's own triggers and fires immediately, while the
                // loop only sweeps every few minutes.
                const hold =
                  reason.startsWith('it is flagged by threat detection') ? THREAT_HOLD
                  : reason.startsWith('it is tagged risk: wire-format') ? WIRE_HOLD
                  : null;
                if (hold) {
                  await revoke(pr);
                  await postHold(number, hold);
                }
                return;
              }

              const reviewed = await signedOffSha(number);
              if (reviewed !== pr.head.sha) {
                core.info(
                  `PR #${number} carries the copilot-reviewed label, but the review ` +
                  `loop signed off ${reviewed || 'nothing'} and the head is ` +
                  `${pr.head.sha}. Disarming.`
                );
                // Declining is not enough. GitHub keeps an auto-merge request
                // armed once enabled, no matter what happens to the labels or
                // the head afterwards, so a PR queued against an older head
                // would still merge unreviewed when its checks finished. Drop
                // the stale label too - re-adding it later is what produces the
                // `labeled` event that brings this workflow back.
                await disableAutoMerge(pr);
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: number, name: 'copilot-reviewed',
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                return;
              }

              if (pr.draft) {
                core.info(`PR #${number} is a draft; marking it ready for review.`);                await github.graphql(
                  `mutation($id: ID!) {
                     markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                       pullRequest { number }
                     }
                   }`,
                  { id: pr.node_id }
                );
              }

              // Idempotency: ask before telling, so a re-run is a no-op rather
              // than an error swallowed by a catch block. This also re-reads the
              // head and the labels: several API calls have happened since the
              // sign-off SHA was checked, and everything below acts on `main` -
              // the direct merge in particular is immediate.
              //
              // Labels are re-read here because `concurrency` on this workflow
              // sets `cancel-in-progress: false`. A `labeled` event carrying the
              // threat flag queues behind a run already in flight for this pull
              // request, and that older run holds a snapshot taken before the
              // label existed. Without this check it would merge the flagged
              // pull request before the queued run ever reached `revoke`.
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                   repository(owner: $owner, name: $repo) {
                     pullRequest(number: $number) {
                       autoMergeRequest { enabledAt }
                       mergeable
                       headRefOid
                       labels(first: 100) { nodes { name } }
                     }
                   }
                 }`,
                { owner, repo, number }
              );
              const state = repository.pullRequest;

              if ((state.labels.nodes || []).some(l => l.name === THREAT_LABEL)) {
                core.warning(
                  `PR #${number} was flagged by threat detection during this run. ` +
                  'Disarming instead of merging.'
                );
                await revoke(pr);
                await postHold(number, THREAT_HOLD);
                return;
              }

              if (state.headRefOid !== reviewed) {
                core.info(
                  `PR #${number} head moved to ${state.headRefOid} during this run, ` +
                  `past the signed-off ${reviewed}. Doing nothing.`
                );
                return;
              }

              if (state.autoMergeRequest) {
                core.info(
                  `Auto-merge already enabled on PR #${number} at ` +
                  `${state.autoMergeRequest.enabledAt}. Nothing to do.`
                );
              } else {
                try {
                  await github.graphql(
                    `mutation($id: ID!) {
                       enablePullRequestAutoMerge(
                         input: { pullRequestId: $id, mergeMethod: SQUASH }
                       ) {
                         pullRequest { number }
                       }
                     }`,
                    { id: pr.node_id }
                  );
                  core.notice(
                    `Auto-merge (squash) enabled on PR #${number}. It will merge ` +
                    'once every required check on main passes.'
                  );
                } catch (error) {
                  const message = String(error.message || error);
                  // GitHub refuses to queue a PR that is already mergeable right
                  // now. Swallowing that leaves a green run and an open PR, which
                  // is exactly the stall this workflow exists to prevent - so
                  // merge it instead.
                  //
                  // `unstable` belongs here too, and cost PR #89 a failed run
                  // (32763292178) before it was covered. It means "mergeable per
                  // branch protection, but some **non-required** check is failing
                  // or pending" - on #89 all 19 required checks were green and the
                  // only red mark was this repository's own review-loop check,
                  // which is not in the required set. GitHub's refusal is the same
                  // statement in both cases: there is nothing left to wait for, so
                  // there is nothing to queue.
                  //
                  // Merging here does not weaken the gate. Branch protection still
                  // decides what "required" means, `disqualify` has already
                  // established provenance and the `copilot-reviewed` sign-off,
                  // and `sha: reviewed` below refuses the merge outright if the
                  // head moved after that sign-off.
                  if (/clean status|unstable status|not in the correct state/i.test(message)) {
                    core.info(
                      `PR #${number} cannot be queued (${message}); it is already ` +
                      'mergeable. Merging directly.'
                    );
                    await github.rest.pulls.merge({
                      owner, repo, pull_number: number, merge_method: 'squash',
                      // Refuse rather than merge if the head moved since it was
                      // signed off. This merge is immediate, so it is the one
                      // call with no later gate to catch a concurrent push.
                      sha: reviewed,
                    });
                    core.notice(`PR #${number} squash-merged.`);
                    return;
                  }
                  throw error;
                }
              }

              // `main` requires branches to be up to date. Auto-merge does not
              // reliably update a stale branch, and updating it here would push a
              // commit with GITHUB_TOKEN, whose events do not start workflows -
              // the PR would end up with no checks on its new head and could
              // never satisfy protection. Report it and let a human update.
              const { data: fresh } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              if (fresh.mergeable_state === 'behind') {
                core.warning(
                  `PR #${number} is behind main and main requires branches to be ` +
                  'up to date. Auto-merge is queued but cannot complete until the ' +
                  'branch is updated. Click "Update branch" on the PR.'
                );
              }
            }

            if (context.eventName === 'pull_request') {
              await process(context.payload.pull_request.number);
              return;
            }

            // push to main, or a manual dispatch: reconcile every open port PR.
            const { data: open } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });
            // Coarse pre-filter by author only; `disqualify` names every other
            // exclusion out loud rather than dropping PRs silently.
            const candidates = open.filter(
              pr => pr.user.login === 'github-actions[bot]'
            );
            if (candidates.length === 0) {
              core.info('No open port PRs to reconcile.');
              return;
            }
            for (const pr of candidates) {
              await process(pr.number);
            }
