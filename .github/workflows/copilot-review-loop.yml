name: Copilot review loop for port PRs

# Why this workflow exists
# ========================
# `Link Upstream Port` opens one draft PR per run and refuses to open another
# until it lands, so an unattended port PR halts the whole porting pipeline.
# `auto-merge-upstream-port.yml` already lands a port PR once the 15 required
# checks pass. This workflow inserts the missing review step in between:
#
#   PR opened -> unblock its Actions runs -> request Copilot code review ->
#   batch the resulting comments to the Copilot cloud agent -> agent pushes
#   fixes -> Copilot reviews the NEW head -> mark the loop complete ->
#   auto-merge takes over.
#
# The ordering problem this solves
# ================================
# Copilot "always leaves a 'Comment' review, not an 'Approve' review or a
# 'Request changes' review", and those reviews "will not block merging changes".
# `main` also requires zero approving reviews. So nothing in branch protection
# makes a port PR wait for review: auto-merge would fire the moment the 15
# checks went green, typically before Copilot had finished looking at it, and
# the review would land on an already-merged PR.
#
# The gate is therefore explicit and lives outside branch protection: this
# workflow applies the `copilot-reviewed` label when the loop has finished, and
# auto-merge refuses to queue a port PR that does not carry it. No required
# check is weakened, bypassed or removed to achieve that - the label is an
# ADDITIONAL condition on top of all 15.
#
# Everything here is bound to a commit SHA, not to a timestamp
# ============================================================
# The obvious implementation - "Copilot commented, then the agent pushed, so the
# comments must be handled" - is wrong, and wrong in the dangerous direction. It
# signs off the moment the agent pushes, without anybody ever looking at what
# the agent wrote, and it cannot tell an agent fix from a maintainer's own
# commit.
#
# So the unit of progress is the head SHA. A review counts only if its
# `commit_id` is the current head; comments count only if they belong to such a
# review. `copilot-reviewed` records the SHA it was granted for, and if the head
# moves afterwards - agent, maintainer or automation - the label is removed AND
# any queued auto-merge is cancelled, because GitHub does not cancel auto-merge
# when a label goes away. That also makes a maintainer pushing a manual fix a
# first-class path rather than a permanent stall.
#
# Why a PAT is required, and what happens without one
# ===================================================
# Three steps here cannot use GITHUB_TOKEN:
#
#   * Approving `action_required` runs. PRs created with GITHUB_TOKEN get their
#     workflow runs held for approval, and GITHUB_TOKEN cannot clear that.
#   * Dispatching the fix workflow. `Copilot Review Fix` is dispatched through
#     the workflow dispatches API, and a run dispatched with GITHUB_TOKEN
#     cannot itself trigger further workflow runs - so the push it makes to the
#     pull request branch would raise no checks, leaving the pull request
#     unmergeable for want of the very checks the loop is waiting on.
#   * Requesting the Copilot reviewer. The GraphQL `requestReviews` mutation
#     reports success and attaches nobody under GITHUB_TOKEN - isolated on
#     PR #89, where the identical mutation attached the bot with a user token
#     and nothing with the installation token.
#
# So without the secret this workflow cannot do any part of its job. The review
# request does not degrade to a GITHUB_TOKEN path, because that path is the
# silent no-op above; it raises instead, which fails the run with the reason in
# the log. A maintainer then requests the review and fixes the comments by hand,
# and the SHA-bound logic above picks that up on its own.
#
# Nothing here fails silently. That is the failure mode that left a release
# stuck for a week behind a quiet GITHUB_TOKEN fallback in release-please.yml.
# Every stall writes its reason into a single status comment on the PR and
# withholds `copilot-reviewed`, so the PR parks visibly with auto-merge
# disengaged rather than merging unreviewed.

# No `pull_request` or `pull_request_review` trigger, on purpose.
#
# Every pull request this workflow cares about is opened by
# `github-actions[bot]`, so every `pull_request` run it queues is held in
# `action_required` - and a `pull_request_review` run queued by Copilot
# submitting its review is held AND unapprovable, because `/approve` only
# serves runs "from a fork pull request or queued by the Actions bot" and
# Copilot is neither. Those runs did no work: `unblockRuns` skips this
# workflow's own held runs by name, and the scheduled sweep below is the
# authority for every hop anyway.
#
# What they did do is put a permanent "1 workflow awaiting your approval"
# banner on the pull request that no automation could ever clear, so the
# maintainer was asked to approve a run that would have been a no-op.
# Observed on PR #92, run 33399328583. Not emitting the run is the only fix;
# there is no credential that can approve it. The event triggers bought
# nothing here - they were held by the same gate they existed to clear.
on:
  # Two reasons this sweep is not optional. There is no event for "a run is
  # waiting for approval" - `workflow_run` has no `action_required` activity
  # type - and delivery of `pull_request_review` for an App reviewer is not
  # something the docs promise. The sweep is the guaranteed path.
  # `Link Upstream Port` opens its PR as `github-actions[bot]`, so every
  # `pull_request` run that PR triggers is held for approval. `workflow_run`
  # is the way in: it runs on `main` in the base repo, so it is never held,
  # and it fires as soon as the port workflow finishes - by which point the
  # PR and its held runs already exist. Without it a port PR waits up to a
  # full cron window purely because of when it happened to open (PR #92
  # opened at 18:59, twelve minutes after the 18:48 sweep, and sat).
  # `Copilot Review Fix` is the other half of the loop, and until it was listed
  # here its failure was invisible until the next sweep. Both are safe: a
  # `workflow_run` run executes on `main` in the base repo, so it is never held
  # for approval the way a `pull_request` run on a bot PR is.
  workflow_run:
    workflows: ["Link Upstream Port", "Copilot Review Fix"]
    types: [completed]
  # The sweep is not a backstop here, it is the primary path for every hop
  # after the PR opens, because the event triggers that would have driven
  # those hops are gone (see the header above). At `*/30` each of
  # review-submitted, agent-push and re-review could wait a full window,
  # stacking into more than an hour of pure scheduling latency on one PR.
  # `*/5` bounds it. The run is one github-script step over open PRs, and
  # reconciliation is idempotent, so the extra frequency costs nothing.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # Read-only on purpose: listing held runs needs read, and approving them is
  # done with PIPELINE_PAT, not with GITHUB_TOKEN.
  actions: read

# Deliberately ONE global group, not one per pull request. The scheduled sweep
# would otherwise key on `github.ref` while a `pull_request` event keys on the
# PR number, so the two could examine the same PR at the same time, read the
# same state, and both dispatch the agent - two paid agent sessions, and a
# round counter that only advanced once. The sweep already walks every
# candidate sequentially, so serialising the whole workflow costs nothing.
concurrency:
  group: copilot-review-loop
  cancel-in-progress: false

jobs:
  review-loop:
    runs-on: ubuntu-latest
    steps:
      # Runs BEFORE the review loop and independently of it, because the loop
      # only ever looks at pull requests `disqualify` accepts: opened by
      # `github-actions[bot]`, labelled `upstream-sync` + `automation`, and
      # explicitly NOT `autorelease: pending`. Held runs are not that narrow.
      # Every release-please pull request is opened by the same bot and so has
      # all five of its `pull_request` runs held, and nothing in this repo ever
      # approved them: the loop skipped the pull request by design, so a
      # maintainer had to clear them by hand on every single release, and until
      # they did, the required checks could not report and the release sat.
      # Observed on `release-please--branches--main--components--ableton-link-rs`
      # on 21, 24 and 31 Aug.
      #
      # Scope is deliberately drawn at "our own bot, on a branch in this
      # repository". `/approve` also serves fork pull requests, and the
      # repository's fork policy holds runs from contributors new to GitHub on
      # purpose; blanket-approving every held run would auto-run unreviewed
      # code from strangers. Both conditions below are checked, and the fork
      # check is on `head_repository`, not on the branch name, because a branch
      # name proves nothing about where the code came from.
      - name: Approve held runs on our own bot branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PIPELINE_PAT: ${{ secrets.PIPELINE_PAT }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pat = process.env.PIPELINE_PAT || '';
            // GITHUB_TOKEN cannot clear `action_required`, so with no PAT there
            // is nothing to try. Warn rather than fail: the review loop below
            // reports the same missing secret on the pull requests it owns, and
            // failing here would bury that message.
            if (!pat) {
              core.warning('PIPELINE_PAT is not set; held runs cannot be approved.');
              return;
            }

            // `status=action_required` is the server-side filter for held runs.
            // Runs also surface it as a *conclusion* once they finish being
            // held, and the list endpoint does not match those, so the
            // conclusion is checked client-side too.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, status: 'action_required', per_page: 100 },
            );

            // Bounded to the CURRENT head of an open pull request, and that
            // bound is load-bearing rather than an optimisation. Held runs are
            // never garbage-collected: this repository had accumulated 40+ of
            // them on superseded heads of the release-please branch alone.
            // Approving those would relaunch months-old jobs against dead SHAs
            // - burning minutes, publishing check runs nobody is waiting on,
            // and doing it again for every stale head ever pushed. A held run
            // only matters if a pull request is currently parked behind it.
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const liveHeads = new Set(open.map(pr => pr.head.sha));

            const held = runs.filter(r =>
              (r.status === 'action_required' || r.conclusion === 'action_required') &&
              liveHeads.has(r.head_sha) &&
              r.actor && r.actor.login === 'github-actions[bot]' &&
              r.head_repository &&
              r.head_repository.full_name.toLowerCase() === `${owner}/${repo}`.toLowerCase());

            if (held.length === 0) {
              core.info('No held runs on open bot pull requests in this repository.');
              return;
            }

            // Same statement-about-the-run 403 the review loop knows about: a
            // run queued by anyone other than the Actions bot is unapprovable
            // by any credential. It should not reach here given the filter
            // above, but a skipped run must not abort the rest of the batch.
            const UNAPPROVABLE = /not from a fork pull request or queued by the Actions bot/i;
            let failures = [];
            for (const run of held) {
              const res = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/runs/${run.id}/approve`,
                {
                  method: 'POST',
                  headers: {
                    authorization: `token ${pat}`,
                    accept: 'application/vnd.github+json',
                    'x-github-api-version': '2022-11-28',
                    'user-agent': 'copilot-review-loop',
                  },
                },
              );
              if (res.ok) {
                core.info(`Approved held run ${run.id} (${run.name}) on ${run.head_branch}.`);
                continue;
              }
              const text = await res.text();
              if (UNAPPROVABLE.test(text)) {
                core.notice(`Run ${run.id} (${run.name}) cannot be approved through the API.`);
                continue;
              }
              failures.push(`${run.id} (${run.name}): ${res.status} ${text.slice(0, 200)}`);
            }

            // Fail loudly. A held run that silently stayed held is exactly the
            // quiet stall this file exists to prevent - it looks green here and
            // parks the pull request behind checks that will never report.
            if (failures.length > 0) {
              core.setFailed(`Could not approve held run(s):\n${failures.join('\n')}`);
            }

      - name: Drive the review loop
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PIPELINE_PAT: ${{ secrets.PIPELINE_PAT }}
        with:
          script: |
            const { owner, repo } = context.repo;

            // One reviewer, three presentations, and none of them can request
            // the review: Copilot is a Bot, so the request has to go through the
            // GraphQL `requestReviews` mutation with `botIds` (see
            // `requestCopilotReview` below). REST `POST .../requested_reviewers`
            // reports success and attaches nobody whichever login it is given.
            // The names still matter for *matching* what comes back: reviews are
            // authored by `copilot-pull-request-reviewer[bot]`, review comments
            // by `Copilot`, and a requested Bot node in GraphQL reports the bare
            // `copilot-pull-request-reviewer`.
            const COPILOT_LOGIN = 'Copilot';
            const REVIEWER = 'copilot-pull-request-reviewer[bot]';
            const DONE_LABEL = 'copilot-reviewed';
            // Applied by gh-aw's threat detection when it flags an agent's own
            // output (prompt injection, secret leak, or malicious patch). In
            // warn mode gh-aw publishes the pull request anyway and puts the
            // banner "Manual review is REQUIRED before any follow-up
            // automation" in the body. This loop is that follow-up automation,
            // so it has to honour the banner instead of merging past it.
            const THREAT_LABEL = 'agentic-threat-detected';
            // One round is: comments dispatched to the agent, agent pushes, and
            // Copilot reviews the result. Two rounds absorb a review plus a
            // follow-up on the agent's own changes. Past that the pull request
            // needs a human, not another lap.
            const MAX_ROUNDS = 2;
            // How long a phase may sit with nothing happening before the pull
            // request is declared stuck. Copilot review usually lands in
            // minutes and an agent session in tens of minutes; six hours is
            // "something broke", not "be patient".
            const STALL_HOURS = 6;

            const STATE_MARKER = '<!-- copilot-review-loop:state -->';
            const pat = process.env.PIPELINE_PAT || '';
            const hasPat = pat.length > 0;

            // Raw REST calls authenticated as a real user, for the two steps
            // that reject installation tokens. Deliberately not a second
            // Octokit: github-script's bundled modules are not a documented
            // `require` surface, whereas `fetch` is in the runtime.
            async function userRequest(method, path, body) {
              const res = await fetch(`https://api.github.com${path}`, {
                method,
                headers: {
                  authorization: `Bearer ${pat}`,
                  accept: 'application/vnd.github+json',
                  'x-github-api-version': '2022-11-28',
                  'content-type': 'application/json',
                  'user-agent': 'copilot-review-loop',
                },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
              if (!res.ok) {
                const text = await res.text();
                throw new Error(`${method} ${path} -> ${res.status} ${text.slice(0, 300)}`);
              }
              if (res.status === 204) return null;
              return res.json().catch(() => null);
            }

            // GraphQL as a real user. Same reason as `userRequest`, plus one
            // specific to reviewer requests: `requestReviews` with `botIds`
            // returns success under `GITHUB_TOKEN` and attaches nobody.
            // Isolated on PR #89 - the identical mutation, same pull request,
            // same minute, no bot with the installation token and
            // `Bot:copilot-pull-request-reviewer` with a user token. GraphQL
            // also reports errors in a 200 body, so those are surfaced here.
            async function userGraphql(query, variables) {
              const res = await fetch('https://api.github.com/graphql', {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${pat}`,
                  accept: 'application/vnd.github+json',
                  'content-type': 'application/json',
                  'user-agent': 'copilot-review-loop',
                },
                body: JSON.stringify({ query, variables }),
              });
              const text = await res.text();
              if (!res.ok) {
                throw new Error(`GraphQL -> ${res.status} ${text.slice(0, 300)}`);
              }
              const payload = JSON.parse(text);
              if (payload.errors && payload.errors.length > 0) {
                throw new Error(
                  `GraphQL -> ${payload.errors.map(e => e.message).join('; ').slice(0, 300)}`,
                );
              }
              return payload.data;
            }

            const labelsOf = pr => pr.labels.map(l => l.name);
            // The body tag is written by an agent, so it is a fail-closed hint
            // rather than the source of truth. The authoritative signal is the
            // file list: link-upstream-port.md names these paths as the ones
            // that "move bytes on a live network shared with Ableton Live,
            // Bitwig, and hardware". Checking files as well as the body matters
            // because the coding agent can pull a wire-format file into a PR
            // that started out as an ordinary port, and the body would never
            // say so.
            const WIRE_FORMAT_PATHS = [
              'src/discovery/messages.rs',
              'src/link/payload.rs',
              'src/link/audio_endpoint.rs',
              'src/encoding.rs',
              'src/link_audio/messages.rs',
              'src/link_audio/payload.rs',
              'src/link_audio/encoding.rs',
              'src/link_audio/codec.rs',
            ];

            async function isWireFormat(pr) {
              if (/risk:\s*wire-format/i.test(pr.body || '')) return true;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              return files.some(f => WIRE_FORMAT_PATHS.includes(f.filename));
            }

            // The single gate for "a human decides this one, not the loop".
            //
            // Both reasons withhold sign-off *and* refuse to hand the pull
            // request to the coding agent, because in both cases letting an
            // agent rewrite the branch unattended is the specific thing being
            // guarded against: wire-format changes because the bytes are shared
            // with Ableton Live, Bitwig and hardware, and threat-flagged output
            // because the agent that produced it is the thing under suspicion.
            //
            // Order matters. The threat flag is checked first so its note is
            // the one shown when a pull request is both flagged and
            // wire-format; "the agent output was flagged" is the more urgent of
            // the two.
            //
            // Judged from whatever pull request object it is handed, and it is
            // the caller's job to hand it a fresh one - see the single
            // `pulls.get` at each decision boundary below. Fetching inside here
            // instead would be worse: the sign-off path needs a fresh object
            // anyway for its head check, and two reads mean two different
            // snapshots, with a window between them in which a label lands and
            // is seen by neither the hold nor the head check.
            async function holdReason(pr) {
              if (labelsOf(pr).includes(THREAT_LABEL)) return 'threat';
              if (await isWireFormat(pr)) return 'wire-format';
              return null;
            }

            // `outstanding` is 0 when Copilot found nothing, in which case the
            // note explains why a clean review still is not enough. It is null
            // at the gate that parks a flagged pull request before any review
            // is asked for at all.
            function holdNote(reason, outstanding, short) {
              if (reason === 'threat') {
                const tail = outstanding === null
                  ? `No automation has run against \`${short}\`: this loop stopped before ` +
                    'approving held workflow runs or asking for a code review.'
                  : outstanding === 0
                  ? `Copilot reviewed \`${short}\` and left nothing outstanding, but that ` +
                    'is a review of the patch, not of the run that produced it.'
                  : `Copilot left ${outstanding} comment(s) on \`${short}\`, and the coding ` +
                    'agent is not allowed to address them unattended.';
                return `${tail} gh-aw's threat detection flagged this pull request ` +
                       `(\`${THREAT_LABEL}\`) and its own banner requires manual review ` +
                       'before any follow-up automation - this loop is that automation. ' +
                       'Read the detection result in the generating workflow run, then ' +
                       'either remove the label to release it to the loop or close the ' +
                       'pull request. `copilot-reviewed` is withheld.';
              }
              return outstanding === 0
                ? 'Copilot reviewed this pull request and left nothing outstanding, ' +
                  'but it is tagged `risk: wire-format`, so it changes bytes on the ' +
                  'network. Sign-off is deliberately withheld: a human merges this one.'
                : `Copilot left ${outstanding} comment(s) on \`${short}\`. This pull ` +
                  'request is tagged `risk: wire-format`, so the coding agent is not ' +
                  'allowed to change it unattended. Address the comments by hand; the ' +
                  'loop will re-review whatever you push.';
            }

            // ---- Durable per-PR state -------------------------------------
            // One status comment per pull request, rewritten in place. A single
            // mutable comment beats a scatter of marker comments: it survives
            // comment pagination, it carries the timestamps stall detection
            // needs, and a human reading the PR gets one honest summary instead
            // of a thread of robot noise.
            const BLANK = { phase: 'new', phaseSince: null, reviewedSha: null,
                            dispatchedSha: null, rounds: 0, note: '' };

            async function readState(number) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              // Author check, not just marker check. The marker is public, so
              // anyone with comment access could otherwise pre-seed a state
              // block claiming `rounds: 2` or a `dispatchedSha` matching the
              // head, and quietly suppress review or dispatch.
              const found = comments.find(
                c => (c.body || '').includes(STATE_MARKER) &&
                     c.user && c.user.login === 'github-actions[bot]',
              );
              if (!found) return { id: null, value: { ...BLANK } };
              const match = /```json\n([\s\S]*?)\n```/.exec(found.body || '');
              let value = { ...BLANK };
              if (match) {
                try {
                  value = { ...BLANK, ...JSON.parse(match[1]) };
                } catch (err) {
                  core.warning(`PR #${number}: unreadable loop state, resetting it.`);
                }
              }
              if (typeof value.rounds !== 'number' || !Number.isFinite(value.rounds)) {
                value.rounds = 0;
              }
              return { id: found.id, value };
            }

            function renderState(value) {
              return [
                STATE_MARKER,
                '**Copilot review loop**',
                '',
                value.note,
                '',
                '<details><summary>loop state</summary>',
                '',
                '```json',
                JSON.stringify(value, null, 2),
                '```',
                '',
                '</details>',
              ].join('\n');
            }

            async function writeState(number, handle, patch) {
              const prev = handle.value;
              const next = { ...prev, ...patch };
              if (patch.phase && patch.phase !== prev.phase) {
                next.phaseSince = new Date().toISOString();
              }
              if (!next.phaseSince) next.phaseSince = new Date().toISOString();
              const body = renderState(next);
              if (handle.id) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: handle.id, body,
                });
              } else {
                const { data } = await github.rest.issues.createComment({
                  owner, repo, issue_number: number, body,
                });
                handle.id = data.id;
              }
              handle.value = next;
              return next;
            }

            function stalled(value) {
              if (!value.phaseSince) return false;
              const age = Date.now() - new Date(value.phaseSince).getTime();
              return age > STALL_HOURS * 3600 * 1000;
            }

            // ---- Scope ----------------------------------------------------
            // Same contract as auto-merge-upstream-port.yml. Deliberately
            // strict: this workflow can spend Copilot requests and cause
            // commits to be pushed, so it must never reach a pull request it
            // does not own. `risk: wire-format` is NOT rejected here - those are
            // still worth reviewing - it only forbids agent dispatch and
            // sign-off further down.
            function disqualify(pr) {
              const labels = labelsOf(pr);
              if (pr.state !== 'open') return `state is ${pr.state}`;
              if (pr.base.ref !== 'main') return `base is ${pr.base.ref}`;
              if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
                return 'head branch is not in this repository';
              }
              if (pr.user.login !== 'github-actions[bot]') return `author is ${pr.user.login}`;
              // No branch-name check. The port workflow's branch name is chosen
              // by the model per run, not fixed by link-upstream-port.md: #69,
              // #76 and #83 happened to use `port/`, but #86 used
              // `chore/advance-submodule-...` and was skipped entirely. The
              // `upstream-sync` + `automation` label pair below is the actual
              // contract, and it is applied only by the port workflow.
              if (!labels.includes('upstream-sync') || !labels.includes('automation')) {
                return `labels are [${labels.join(', ')}]`;
              }
              if (labels.includes('autorelease: pending')) return 'it is a release PR';
              return null;
            }

            // ---- Steps ----------------------------------------------------
            // Returns null on success, or a human-readable reason. Distinguishing
            // "no PAT" from "the PAT was rejected" matters: reporting an expired
            // token as a missing secret sends the maintainer to fix the wrong
            // thing.
            // `/approve` only serves runs GitHub considers approvable through
            // it: fork PRs, and runs queued by the Actions bot. Anything else
            // gets a 403 that no credential can satisfy - it is a statement
            // about the run, not about the token.
            const UNAPPROVABLE = /not from a fork pull request or queued by the Actions bot/i;

            async function unblockRuns(pr) {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: pr.head.sha, per_page: 100,
              });
              const held = runs.workflow_runs.filter(
                r => (r.status === 'action_required' || r.conclusion === 'action_required') &&
                     // Never wait on this workflow's own runs. Copilot submitting
                     // a review fires `pull_request_review`, which queues another
                     // review-loop run; that run is held, is not a required
                     // check, and is unapprovable because Copilot is not the
                     // Actions bot. Left in, the loop parks itself in
                     // `blocked-runs` on the very event it is waiting for - which
                     // is what happened to PR #86 while all 20 required checks
                     // were already green. The scheduled sweep is the authority,
                     // so these runs are redundant as well as harmful.
                     // `context.workflow` is this workflow's own `name:`, so the
                     // match holds without hardcoding it in two places.
                     r.name !== context.workflow,
              );
              if (held.length === 0) return null;
              if (!hasPat) {
                return 'the `PIPELINE_PAT` secret is not set, so they cannot be ' +
                       'approved here';
              }
              for (const run of held) {
                try {
                  await userRequest(
                    'POST',
                    `/repos/${owner}/${repo}/actions/runs/${run.id}/approve`,
                  );
                  core.info(`Approved held run ${run.id} (${run.name}).`);
                } catch (err) {
                  if (UNAPPROVABLE.test(err.message)) {
                    // Not blocking. Branch protection is the real gate: if this
                    // run does gate a required check, auto-merge simply waits and
                    // the pull request fails closed. Blocking the review here
                    // would only add a second, permanent stall on top of it.
                    core.notice(
                      `Run ${run.id} (${run.name}) cannot be approved through the API; ` +
                      'leaving it to the required checks.',
                    );
                    continue;
                  }
                  core.warning(`Could not approve run ${run.id}: ${err.message}`);
                  return `approving run ${run.id} failed (\`${err.message}\`), which ` +
                         'usually means `PIPELINE_PAT` lacks Actions write access or ' +
                         'has expired';
                }
              }
              return null;
            }

            async function reviewsForHead(number, headSha) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: number, per_page: 100,
              });
              return reviews.filter(
                r => r.user && r.user.login === REVIEWER && r.commit_id === headSha,
              );
            }

            // Requesting Copilot needs BOTH the right API and the right token,
            // and each was a separate silent no-op.
            //
            // This is now a *fallback*. The repository ruleset's
            // `copilot_code_review` rule carries `review_on_push: true`, so
            // Copilot re-reviews on its own every time the fix agent pushes,
            // and this path only runs when that did not produce a review for
            // the current head - a draft edge case, a rule change, or a review
            // that was dismissed. It is kept because it is the only recovery
            // available when the ruleset does not fire, and because both of
            // the failures below are invisible in a response.
            //
            // 1. REST. `POST .../requested_reviewers` with
            //    `reviewers: ["Copilot"]` returns **201 Created** and adds
            //    nobody, even with a `repo`-scoped user token (PR #86). Copilot
            //    is a Bot, and bots can only be requested via the GraphQL
            //    `requestReviews` mutation with `botIds`.
            // 2. Token. That mutation *also* reports success and attaches
            //    nobody under `GITHUB_TOKEN`. Isolated on PR #89: identical
            //    mutation, same pull request, same minute - no bot with the
            //    installation token, `Bot:copilot-pull-request-reviewer` with a
            //    user token. Hence `userGraphql`.
            //
            // Neither failure is visible in a response, so the result is
            // asserted below rather than assumed.
            //
            // `union: true` preserves reviewers already on the PR (CODEOWNERS
            // puts a human there). The node ID is resolved at run time rather
            // than hardcoded, and that call is also where the three confusing
            // names reconcile: the REST user endpoint for
            // `copilot-pull-request-reviewer[bot]` reports `login: "Copilot"`
            // with `node_id: BOT_...`, while GraphQL reports the login without
            // the `[bot]` suffix. One identity, three presentations.
            async function requestCopilotReview(number) {
              // Must be the PAT. Under `GITHUB_TOKEN` the mutation below reports
              // success and attaches nobody, so without a user credential this
              // step can only fail silently - say so plainly instead.
              if (!hasPat) {
                throw new Error(
                  `cannot request Copilot review of PR #${number}: the ` +
                  '`PIPELINE_PAT` secret is not set, and `GITHUB_TOKEN` cannot ' +
                  'attach a bot reviewer',
                );
              }
              const { data: bot } = await github.rest.users.getByUsername({
                username: `${REVIEWER}`,
              });
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              const result = await userGraphql(
                `mutation($pr: ID!, $bots: [ID!]!) {
                   requestReviews(input: {
                     pullRequestId: $pr, botIds: $bots, union: true
                   }) {
                     pullRequest {
                       reviewRequests(first: 20) {
                         nodes { requestedReviewer { __typename ... on Bot { login } } }
                       }
                     }
                   }
                 }`,
                { pr: pr.node_id, bots: [bot.node_id] },
              );
              // Confirm rather than assume. A silent no-op here is exactly the
              // failure this function exists to replace, so it must be loud.
              const landed = (result.requestReviews.pullRequest.reviewRequests.nodes || [])
                .some(n => n.requestedReviewer &&
                           n.requestedReviewer.__typename === 'Bot');
              if (!landed) {
                throw new Error(
                  `requested Copilot review of PR #${number} but no bot reviewer is ` +
                  'attached; the request did not take effect',
                );
              }
            }


            // Must be GraphQL. REST `listRequestedReviewers` returns only
            // `users` and `teams` - a requested **Bot** is invisible to it,
            // verified on PR #86 while GraphQL simultaneously confirmed the bot
            // was attached. Asking REST would therefore always answer "no
            // reviewer pending", and the loop would re-request a Copilot review
            // on every 30-minute sweep for the entire life of the PR.
            async function reviewerPending(number) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              const result = await github.graphql(
                `query($id: ID!) {
                   node(id: $id) {
                     ... on PullRequest {
                       reviewRequests(first: 20) {
                         nodes {
                           requestedReviewer {
                             __typename
                             ... on Bot { login }
                             ... on User { login }
                           }
                         }
                       }
                     }
                   }
                 }`,
                { id: pr.node_id },
              );
              const nodes = (result.node && result.node.reviewRequests.nodes) || [];
              return nodes.some(n => {
                const r = n.requestedReviewer;
                if (!r) return false;
                // A Bot's `login` here is the bare `copilot-pull-request-reviewer`,
                // without the `[bot]` suffix REST reports, so match on type and
                // prefix rather than on an exact string.
                if (r.__typename === 'Bot') {
                  return REVIEWER.startsWith(r.login) || r.login === COPILOT_LOGIN;
                }
                return r.login === REVIEWER || r.login === COPILOT_LOGIN;
              });
            }

            // Comments belonging to the reviews for the current head. Tying
            // this to review IDs rather than to a timestamp window is what
            // stops "the agent pushed" from counting as "the comments were
            // addressed".
            // Filtered by review ID alone, deliberately NOT by comment author.
            // The identities differ per endpoint: the review is authored by
            // `copilot-pull-request-reviewer[bot]` while its comments come back
            // authored by `Copilot`. Filtering comments on the bot login
            // matched nothing, so a PR with outstanding comments looked clean
            // and was signed off - that is how PR #83 merged with two
            // unaddressed comments. The review ID is the stronger check anyway:
            // those IDs come from reviews already verified to be the reviewer's
            // and at the current head, so provenance is established without
            // depending on which display name an endpoint happens to use.
            async function commentsForReviews(number, reviewIds) {
              const all = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: number, per_page: 100,
              });
              const ids = new Set(reviewIds);
              return all.filter(c => ids.has(c.pull_request_review_id));
            }

            async function disableAutoMerge(pr) {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                   repository(owner: $owner, name: $repo) {
                     pullRequest(number: $number) { autoMergeRequest { enabledAt } }
                   }
                 }`,
                { owner, repo, number: pr.number },
              );
              if (!repository.pullRequest.autoMergeRequest) return;
              await github.graphql(
                `mutation($id: ID!) {
                   disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                     pullRequest { number }
                   }
                 }`,
                { id: pr.node_id },
              );
              core.notice(`PR #${pr.number}: auto-merge cancelled, head moved past sign-off.`);
            }

            // Returns true when a *granted* label was applied with the PAT, and
            // therefore actually raised the `labeled` event auto-merge needs.
            // Callers that record sign-off must surface a false, or the status
            // comment claims auto-merge may queue when nothing will trigger it.
            async function setLabel(pr, present) {
              const has = labelsOf(pr).includes(DONE_LABEL);
              if (present && has) return true;
              if (present && !has) {
                // Granted with the PAT, and that is load-bearing rather than
                // incidental. `auto-merge-upstream-port.yml` triggers on
                // `pull_request: [labeled]`, and an action taken with
                // GITHUB_TOKEN does not start a workflow run - the same rule
                // that forces the fix agent to push with a PAT. Labelling with
                // GITHUB_TOKEN therefore granted sign-off and raised no event,
                // so auto-merge never re-evaluated and the pull request sat as
                // an unmerged draft with every check green and the label on it.
                // Observed on PR #121: labelled 21:38:09, no auto-merge run.
                //
                // Without a PAT the label is still granted, because withholding
                // sign-off that was genuinely earned would be worse; the run
                // already warns that it is degraded, and the `push` trigger on
                // the next commit to `main` picks the pull request up.
                let viaPat = false;
                if (hasPat) {
                  try {
                    await userRequest(
                      'POST', `/repos/${owner}/${repo}/issues/${pr.number}/labels`,
                      { labels: [DONE_LABEL] },
                    );
                    viaPat = true;
                  } catch (err) {
                    // Labels are the issues API, so this needs `issues: write`
                    // on the PAT - a different scope from the ones the dispatch
                    // and review request use. If it is missing, fall through to
                    // GITHUB_TOKEN rather than failing: a sign-off that lands
                    // without triggering auto-merge is recoverable, and one
                    // that throws leaves the pull request unlabelled with the
                    // loop reporting success.
                    core.warning(
                      `PR #${pr.number}: PAT could not label (${err.message}); ` +
                      'falling back to GITHUB_TOKEN.');
                  }
                }
                if (!viaPat) {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: pr.number, labels: [DONE_LABEL],
                  });
                  core.warning(
                    `PR #${pr.number}: labelled with GITHUB_TOKEN, so auto-merge ` +
                    'will not be triggered by it. Merge by hand if it parks.');
                }
                return viaPat;
              } else if (!present && has) {
                // Only a 404 is benign here - it means the label was already
                // gone. Anything else must propagate, because the caller is
                // about to record that sign-off was revoked, and recording that
                // while the label is still on the PR is exactly how an
                // unreviewed head gets merged.
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pr.number, name: DONE_LABEL,
                  });
                } catch (err) {
                  if (err.status !== 404) throw err;
                }
              }
            }

            // Revoke a sign-off: cancel auto-merge and drop the label, and only
            // then let the caller clear `reviewedSha`. Order matters - if the
            // label removal throws, `reviewedSha` must survive so the next run
            // takes this branch again instead of assuming the job was done.
            async function revoke(pr) {
              await disableAutoMerge(pr);
              await setLabel(pr, false);
            }

            // NOTE: this is `reconcile`, not `process`. A local function named
            // `process` hoists over Node's global `process` inside
            // github-script's eval scope, so `process.env.PIPELINE_PAT` above
            // reads a property of `undefined` and the whole run dies before it
            // touches a single pull request. Confirmed the hard way in run
            // 32383137359.
            // The workflow is addressed by its compiled lock file, which is
            // the file GitHub actually knows about. `copilot-review-fix.md` is
            // source; asking the API for it returns 404.
            const FIX_WORKFLOW = 'copilot-review-fix.lock.yml';

            async function dispatchFixWorkflow(number, head) {
              const before = new Date(Date.now() - 30_000).toISOString();
              // Must match `run-name:` in copilot-review-fix.md exactly. It is
              // the only positive correlation available: the dispatch API names
              // no run, and "newest dispatch run of this workflow" would let a
              // run created for a different pull request stand in for this one.
              const runName = `Copilot Review Fix - PR #${number} @ ${head}`;
              await userRequest(
                'POST',
                `/repos/${owner}/${repo}/actions/workflows/${FIX_WORKFLOW}/dispatches`,
                { ref: 'main', inputs: {
                    pull_request_number: String(number),
                    head_sha: head,
                    // gh-aw's own input, and not optional. The compiled workflow
                    // gates its "Checkout PR branch" step on
                    // `aw_context.item_type == 'pull_request'`; without it the
                    // agent starts from `main`, reads none of the pull request's
                    // code, and has nothing coherent to push back to the branch.
                    aw_context: JSON.stringify({
                      item_type: 'pull_request', item_number: number }),
                  } },
              );

              // A dispatched run does not appear instantly, so this polls rather
              // than reading once. Twelve attempts at five seconds is a minute,
              // which is far longer than the queue normally takes and still
              // finite - if no run has appeared by then the dispatch did not
              // take, and saying so loudly beats recording a fiction.
              for (let attempt = 0; attempt < 12; attempt++) {
                await new Promise(r => setTimeout(r, 5000));
                const runs = await userRequest(
                  'GET',
                  `/repos/${owner}/${repo}/actions/workflows/${FIX_WORKFLOW}` +
                  `/runs?event=workflow_dispatch&created=%3E${before}&per_page=20`,
                );
                // Both conditions are required. The title identifies the
                // pull request and head, so a run dispatched for a different
                // pull request in the same sweep cannot stand in for this one.
                // The timestamp rules out a run left over from an earlier
                // dispatch for the same head - a retry after a failed round
                // would otherwise match its own previous run instantly. The
                // `created` query parameter is deliberately not trusted to have
                // been honoured, so it is re-checked here in code.
                const run = (runs.workflow_runs || [])
                  .find(r => r.display_title === runName && r.created_at >= before);
                if (run) {
                  core.info(`PR #${number}: Copilot Review Fix run ${run.id} started.`);
                  return run.id;
                }
              }
              throw new Error(
                `dispatched ${FIX_WORKFLOW} for PR #${number} but no run appeared ` +
                'within 60s - the dispatch did not take.');
            }

            // What the dispatched `Copilot Review Fix` run did, or null if no
            // run for this exact pull request and head can be found.
            //
            // The loop used to treat "dispatched" as "in progress" until the
            // 6h stall timer expired, so a run that failed two minutes in still
            // parked the pull request for six hours with a note saying it was
            // waiting. Observed on PR #121: the agent wrote a correct fix and
            // the push was rejected because `PIPELINE_PAT` lacks
            // `contents: write`, and the loop reported "waiting on the coding
            // agent" for the next hour. A dead run is knowable immediately, so
            // it should be said immediately.
            async function fixRunOutcome(number, head) {
              const runName = `Copilot Review Fix - PR #${number} @ ${head}`;
              // Deliberately one bounded page, not `paginate`. The Actions
              // list endpoint returns descending `created_at`, so the run being
              // looked for is always on the first page; paginating the whole
              // run history would be pure waste that grows with every run, and
              // it would be re-spent every 5 minutes for as long as a pull
              // request sits in the terminal `agent-failed` state below. A miss
              // degrades to `null`, which is the fail-safe direction.
              // `listWorkflowRuns`, not `listWorkflowRunsForWorkflow`. Octokit
              // exposes exactly two names here - `listWorkflowRuns` (one
              // workflow) and `listWorkflowRunsForRepo` (all of them) - and the
              // third name reads plausibly enough that it shipped and threw
              // `is not a function` on every reconcile, failing the whole run
              // and leaving PR #127 parked in `awaiting-agent` for an hour.
              // The unit test could not catch it: it stubbed the method by
              // name, so it asserted against the same typo.
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: FIX_WORKFLOW,
                event: 'workflow_dispatch', per_page: 100,
              }).then(res => res.data.workflow_runs || []).catch(err => {
                // A read failure must not be reported as a dead run - that
                // would park a pull request whose agent is still working.
                core.warning(`PR #${number}: could not list ${FIX_WORKFLOW} runs: ${err.message}`);
                return null;
              });
              if (!runs) return null;
              const matching = runs.filter(r => r.display_title === runName);
              if (matching.length === 0) return null;
              // Newest first: a retry for the same head is the one that counts.
              matching.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              return matching[0];
            }

            async function reconcile(number) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              const reason = disqualify(pr);
              if (reason) {
                core.info(`PR #${number} not in scope: ${reason}.`);
                return;
              }

              const head = pr.head.sha;
              const short = head.slice(0, 7);
              const handle = await readState(number);

              // gh-aw's banner requires manual review before *any* follow-up
              // automation, and everything below this point is exactly that:
              // `unblockRuns` approves held workflow runs, and
              // `requestCopilotReview` attaches an automated reviewer. Neither
              // may happen on a flagged patch, so the label parks the pull
              // request here rather than at the sign-off and dispatch
              // boundaries alone. Those holds stay: this gate judges the
              // object read at the top of `reconcile`, and a label that lands
              // later in the run is caught only down there.
              //
              // Wire-format is deliberately not checked here. That risk tag
              // withholds sign-off; it does not forbid reviewing the patch.
              if (labelsOf(pr).includes(THREAT_LABEL)) {
                await revoke(pr);
                await writeState(number, handle, {
                  phase: 'human-hold',
                  reviewedSha: null,
                  note: holdNote('threat', null, short),
                });
                core.notice(`PR #${number}: threat-flagged, parked before any automation.`);
                return;
              }

              // Sign-off is granted to a SHA, not to a pull request. New
              // commits revoke it - and must also cancel auto-merge, because
              // GitHub keeps an enabled auto-merge armed no matter what happens
              // to the labels afterwards.
              if (handle.value.reviewedSha && handle.value.reviewedSha !== head) {
                await revoke(pr);
                await writeState(number, handle, {
                  phase: 'restarted',
                  reviewedSha: null,
                  note: `New commits landed (\`${short}\`) after the previous sign-off, ` +
                        'so `copilot-reviewed` was removed and auto-merge was cancelled. ' +
                        'Re-reviewing the new head.',
                });
              }

              const blocked = await unblockRuns(pr);
              if (blocked) {
                await writeState(number, handle, {
                  phase: 'blocked-runs',
                  note: `Workflow runs on this pull request are held in ` +
                        `\`action_required\` and ${blocked}. Approve them from the ` +
                        'Checks tab. `copilot-reviewed` is withheld and auto-merge ' +
                        'stays disengaged until the required checks can report.',
                });
                core.warning(`PR #${number}: held runs not approved - ${blocked}.`);
                return;
              }

              const reviews = await reviewsForHead(number, head);

              if (reviews.length === 0) {
                if (!await reviewerPending(number)) {
                  await requestCopilotReview(number);
                  await writeState(number, handle, {
                    phase: `awaiting-review:${head}`,
                    // Explicit, because a re-request can land in the same phase
                    // string as an earlier request for the same SHA - a
                    // reviewer that was removed without reviewing, say. Without
                    // this the brand-new request inherits an already-expired
                    // stall clock and is declared stuck immediately.
                    phaseSince: new Date().toISOString(),
                    note: `Requested Copilot code review of \`${short}\`.`,
                  });
                  core.info(`PR #${number}: requested Copilot review of ${head}.`);
                  return;
                }
                const st = await writeState(number, handle, {
                  phase: `awaiting-review:${head}`,
                  note: `Waiting on Copilot to review \`${short}\`.`,
                });
                if (stalled(st)) {
                  await writeState(number, handle, {
                    note: `**Stuck.** Copilot code review of \`${short}\` was requested ` +
                          `over ${STALL_HOURS}h ago and has not been submitted. Check ` +
                          'that a paid Copilot plan is active, then re-request the ' +
                          'review by hand. `copilot-reviewed` is withheld.',
                  });
                  core.warning(`PR #${number}: Copilot review has not arrived.`);
                }
                return;
              }

              const outstanding = await commentsForReviews(number, reviews.map(r => r.id));

              // Review *state* only started carrying information once
              // auto-approval was enabled (repo Settings > Copilot > Code
              // review). Before that every Copilot review arrived as
              // `COMMENTED` regardless of verdict, so the only usable signal
              // was "did it leave inline comments". Now it can also submit
              // `APPROVED` or `CHANGES_REQUESTED`, and both need handling.
              const approved = reviews.some(r => r.state === 'APPROVED');
              const changesRequested = reviews.some(r => r.state === 'CHANGES_REQUESTED');

              // The hole this closes: `CHANGES_REQUESTED` carrying no inline
              // comments used to read as "nothing outstanding" and sign off on
              // a review that had explicitly withheld approval. It cannot be
              // dispatched either - the fix agent is handed comment URLs, and
              // there are none - so park it for a human instead.
              if (changesRequested && outstanding.length === 0) {
                await revoke(pr);
                await writeState(number, handle, {
                  phase: 'human-hold',
                  reviewedSha: null,
                  note: `Copilot requested changes on \`${short}\` without leaving any ` +
                        'inline comments, so there is nothing to hand the fix agent. ' +
                        'Read the review body and push a fix. `copilot-reviewed` is ' +
                        'withheld and auto-merge stays disengaged.',
                });
                core.warning(`PR #${number}: changes requested with no inline comments.`);
                return;
              }

              // Deliberately still gated on `outstanding.length === 0` rather
              // than on `approved`. Copilot can approve while leaving
              // non-blocking suggestions, and this repository's standing rule
              // is that every review finding is resolved before merge. An
              // approval is therefore recorded, not obeyed.
              if (outstanding.length === 0) {
                // One read governs this entire decision. `pr` was fetched at
                // the top of `reconcile`, several API calls ago - reviews, then
                // their comments - so it is too stale to sign off from. Every
                // check from here down, and the label application itself, uses
                // this one object: a second read would reopen the window it
                // exists to close, letting a label land in between and be seen
                // by neither check.
                const { data: fresh } = await github.rest.pulls.get({
                  owner, repo, pull_number: number,
                });
                const hold = await holdReason(fresh);
                if (hold) {
                  // The tag can be added to the body after a sign-off, so this
                  // revokes rather than merely declining to grant.
                  await revoke(fresh);
                  await writeState(number, handle, {
                    phase: 'human-hold',
                    reviewedSha: null,
                    note: holdNote(hold, 0, short),
                  });
                  core.notice(`PR #${number}: ${hold}, held for a human.`);
                  return;
                }
                // Sign-off already granted for this exact head, but degraded:
                // the label went on without raising the event auto-merge needs.
                // Re-running the grant cannot fix that - the label is already
                // present, so no event will ever be raised for it - and would
                // overwrite the note explaining the problem with one claiming
                // auto-merge may queue. Leave it stated. This sits *below* the
                // hold, not above it: a hold that appears after a degraded
                // sign-off must still revoke and clear `reviewedSha`, or the
                // loop returns from stale state forever and never re-examines
                // the label.
                if (handle.value.phase === 'done-degraded' &&
                    handle.value.reviewedSha === head) {
                  core.warning(`PR #${number}: still signed off but degraded at ${head}.`);
                  return;
                }
                // A sign-off is only meaningful for the exact commit reviewed.
                if (fresh.head.sha !== head) {
                  core.info(`PR #${number}: head moved during the run; re-examining next time.`);
                  return;
                }
                // State first, then the label. The label is what auto-merge
                // reacts to, so if `writeState` failed after labelling there
                // would be a sign-off with no recorded SHA and therefore
                // nothing able to revoke it later.
                await writeState(number, handle, {
                  phase: 'done',
                  reviewedSha: head,
                  note: `Copilot reviewed \`${short}\` with nothing outstanding` +
                        (approved ? ' and submitted an approving review' : '') + '. ' +
                        'Auto-merge may now queue this pull request; it still merges ' +
                        'only after every required check passes.',
                });
                // A label applied with GITHUB_TOKEN raises no event, so the
                // note written just above - "auto-merge may now queue this" -
                // would be false. This file's rule is that every stall writes
                // its reason into the status comment, so say so there rather
                // than only in a run annotation nobody reads.
                if (!(await setLabel(fresh, true))) {
                  await writeState(number, handle, {
                    phase: 'done-degraded',
                    note: `Copilot reviewed \`${short}\` with nothing outstanding, ` +
                          'but `copilot-reviewed` could not be applied with the PAT, ' +
                          'so no `labeled` event was raised and **auto-merge will not ' +
                          'pick this up on its own**. Merge it by hand, or push ' +
                          'anything to `main` to re-trigger auto-merge.',
                  });
                  core.warning(`PR #${number}: signed off, but degraded - auto-merge not triggered.`);
                  return;
                }
                core.notice(`PR #${number}: review loop complete at ${head}.`);
                return;
              }

              // Same single-read rule as the sign-off path above: the object
              // the hold is judged from is the object revoked against.
              const { data: current } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              const hold = await holdReason(current);
              if (hold) {
                await revoke(current);
                await writeState(number, handle, {
                  phase: 'human-hold',
                  reviewedSha: null,
                  note: holdNote(hold, outstanding.length, short),
                });
                core.notice(`PR #${number}: ${hold}, agent dispatch refused.`);
                return;
              }

              if (handle.value.dispatchedSha === head) {
                // The head has not moved since the dispatch. That is either
                // "still running" or "the run is over and nothing landed", and
                // those deserve very different notes.
                const run = await fixRunOutcome(number, head);
                // Already known dead. `fixRunOutcome` returns null when the
                // runs cannot be listed, so without this a transient list
                // failure would fall through and overwrite the terminal note
                // with "waiting on the coding agent" - and, six hours after
                // `agent-failed` was entered, with the "Stuck" stall note,
                // pointing the maintainer at a timer instead of at the run
                // link that is the whole point of this branch.
                if (!run && handle.value.phase === 'agent-failed') return;
                if (run && run.status === 'completed') {
                  const ok = run.conclusion === 'success';
                  await writeState(number, handle, {
                    phase: 'agent-failed',
                    note: ok
                      ? `**Nothing landed.** Copilot Review Fix ` +
                        `([run](${run.html_url})) finished successfully for ` +
                        `\`${short}\` but pushed no commit, so the ` +
                        `${outstanding.length} outstanding comment(s) are ` +
                        'unchanged. Usually this means the agent judged the ' +
                        'comments wrong and refused them - read the Copilot ' +
                        'Review Fix summary comment on this pull request. ' +
                        'Nothing further is dispatched; ' +
                        '`copilot-reviewed` is withheld.'
                      : `**The coding agent run failed** ` +
                        `(\`${run.conclusion}\`, [run](${run.html_url})) for ` +
                        `\`${short}\`, so the ${outstanding.length} outstanding ` +
                        'comment(s) were never fixed. The loop is not retrying: ' +
                        'a failing run fails the same way twice. Fix the cause ' +
                        'or address the comments by hand - the loop re-reviews ' +
                        'whatever you push. `copilot-reviewed` is withheld.',
                  });
                  core.warning(
                    `PR #${number}: Copilot Review Fix run ${run.id} ended ` +
                    `'${run.conclusion}' without moving the head.`);
                  return;
                }
                const st = await writeState(number, handle, {
                  note: `Waiting on the coding agent to push fixes for \`${short}\`.`,
                });
                if (stalled(st)) {
                  await writeState(number, handle, {
                    note: `**Stuck.** The coding agent was asked to fix \`${short}\` ` +
                          `over ${STALL_HOURS}h ago and has not pushed anything. ` +
                          'Address the review comments by hand; the loop re-reviews ' +
                          'whatever you push. `copilot-reviewed` is withheld.',
                  });
                  core.warning(`PR #${number}: agent has not pushed.`);
                }
                return;
              }

              if (handle.value.rounds >= MAX_ROUNDS) {
                await writeState(number, handle, {
                  phase: 'rounds-exhausted',
                  note: `The coding agent has already had ${handle.value.rounds} pass(es) ` +
                        `at this pull request and Copilot still has ${outstanding.length} ` +
                        'outstanding comment(s). The loop has stopped rather than going ' +
                        'round again. This one needs a human; `copilot-reviewed` is ' +
                        'withheld and auto-merge stays disengaged.',
                });
                core.warning(`PR #${number}: review rounds exhausted.`);
                return;
              }

              if (!hasPat) {
                await writeState(number, handle, {
                  phase: 'needs-pat',
                  note: `Copilot left ${outstanding.length} comment(s) on \`${short}\`, ` +
                        'but they cannot be handed to Copilot Review Fix because ' +
                        'the `PIPELINE_PAT` secret is not set - the workflow ' +
                        'dispatches API needs a token that can trigger ' +
                        'workflow runs, and `GITHUB_TOKEN` cannot: a run it starts ' +
                        'raises no further runs, so the fix push would report no ' +
                        'checks.\n\nAddress them by hand and push; the loop re-reviews ' +
                        'the new head on its own.',
                });
                core.warning(`PR #${number}: cannot dispatch agent without PIPELINE_PAT.`);
                return;
              }

              // Neither review bodies nor file paths are interpolated into the
              // instruction. Both are attacker-influenced - bodies are
              // model-authored text derived from repository content, and git
              // permits filenames containing backticks and newlines - and this
              // comment drives an agent with write access to the branch, so
              // either is a prompt-injection path. GitHub-generated permalinks
              // only; the agent reads the comments itself.
              const digest = outstanding.map(c => `- ${c.html_url}`).join('\n');

              // The POST can succeed while the `writeState` after it fails, or
              // its response can be lost. Recording the dispatch only in state
              // would then let the next sweep dispatch `Copilot Review Fix` a
              // second time for the same head - a second paid agent session for
              // one round. So the marker lives in the dispatch comment itself
              // and is reconciled from the comment list before posting.
              const dispatchMarker = `<!-- copilot-review-loop:dispatch ${head} -->`;
              const priorComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              if (priorComments.some(c => (c.body || '').includes(dispatchMarker))) {
                core.info(`PR #${number}: already dispatched for ${head}; recording it.`);
                await writeState(number, handle, {
                  phase: `awaiting-agent:${head}`,
                  dispatchedSha: head,
                  rounds: Math.max(handle.value.rounds, 1),
                  note: `Handed ${outstanding.length} review comment(s) on \`${short}\` ` +
                        'to Copilot Review Fix (Opus 5).',
                });
                return;
              }

              // Dispatch first, comment second, and assert the dispatch.
              // `POST /actions/workflows/{id}/dispatches` answers 204 with no
              // body - it names no run and reports no failure if the workflow
              // file is missing from the default branch, disabled, or declares
              // no `workflow_dispatch` trigger. Taking that 204 as proof would
              // park the pull request in `awaiting-agent` forever with nothing
              // running, which is precisely the silent stall this loop exists
              // to prevent. So the run is confirmed to exist before anything is
              // recorded.
              //
              // Ordering is a deliberate trade. The comment is the idempotency
              // marker, so posting it before a confirmed dispatch risks a
              // permanent stall - the marker would suppress every retry. Posting
              // it after means a failed comment POST can leave a dispatch with
              // no marker, and the next sweep dispatches a second time. A
              // duplicate round is bounded by MAX_ROUNDS and visible; a
              // permanent stall is neither. Duplicate is the better failure.
              await dispatchFixWorkflow(number, head);

              await userRequest(
                'POST', `/repos/${owner}/${repo}/issues/${number}/comments`,
                {
                  body:
                    `${dispatchMarker}\n` +
                    `Dispatched **Copilot Review Fix** (Opus 5) for the ` +
                    `${outstanding.length} Copilot code review comment(s) on commit ` +
                    `\`${short}\`, listed below. It fixes them as one batch and pushes ` +
                    'to this branch; the loop re-reviews the new head.\n\n' +
                    digest,
                },
              );
              await writeState(number, handle, {
                phase: `awaiting-agent:${head}`,
                dispatchedSha: head,
                rounds: handle.value.rounds + 1,
                note: `Handed ${outstanding.length} review comment(s) on \`${short}\` to ` +
                      `Copilot Review Fix on Opus 5 (round ${handle.value.rounds + 1} of ` +
                      `${MAX_ROUNDS}).`,
              });
              core.info(`PR #${number}: dispatched ${outstanding.length} comment(s).`);
            }

            // Every invocation reconciles every candidate, and does not take a
            // shortcut for the PR that triggered it. GitHub keeps only ONE
            // pending run per concurrency group, and this workflow uses a single
            // global group, so a busy stream of PR events would otherwise cancel
            // the pending scheduled sweep over and over - and the sweep is the
            // only guaranteed recovery path. Reconciling everything on every run
            // makes that coalescing harmless.
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            // Deliberately a coarse pre-filter: author only. Anything finer
            // here silently drops a pull request before `disqualify` can name
            // a reason, which is how PR #86 vanished from the sweep with no
            // log line at all. Let `disqualify` be the single place that
            // decides, so every exclusion is stated out loud.
            const numbers = open
              .filter(pr => pr.user.login === 'github-actions[bot]')
              .map(pr => pr.number);
            // There is no triggering pull request to fold in any more: the
            // `pull_request` and `pull_request_review` triggers were removed
            // because their runs were held and unapprovable (see the header).
            // Every remaining trigger is repository-scoped, so the sweep above
            // is the complete candidate set.

            let failed = [];
            for (const number of numbers) {
              try {
                await reconcile(number);
              } catch (err) {
                failed.push(number);
                core.error(`PR #${number}: ${err.message}`);
              }
            }
            // Any failure fails the run. A partial failure that leaves the run
            // green is the silent stall this workflow exists to avoid: the PR
            // it could not process is exactly the one nobody will notice.
            if (failed.length > 0) {
              core.setFailed(`Failed to process PR(s): ${failed.map(n => `#${n}`).join(', ')}.`);
            }
