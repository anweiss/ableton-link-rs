[package]
name = "ableton-link-rs"
version = "0.3.0"
edition = "2021"
description = "Native Rust implementation of the Ableton Link protocol"
license = "GPL-3.0"
repository = "https://github.com/anweiss/ableton-link-rs"
exclude = [
    "vendor/",
    "target/",
    ".vscode/",
    ".idea/",
    "Dockerfile",
    ".dockerignore",
    "test_interop.sh",
    "*.tar",
    "*.log",
    ".DS_Store",
    ".git/",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
std = [
    "tokio",
    "thiserror",
    "socket2",
    "tracing-subscriber",
    "async-trait",
    "local-ip-address",
    "triple_buffer",
    "rodio",
    "if-addrs",
    "network-interface",
    "libc",
    "audio_thread_priority",
    "hex/std",
    "chrono/std",
    "rand/std",
    "rand/std_rng",
    "rand/thread_rng",
]

# Optional LinkAudio subsystem: streams PCM audio between Link peers over a
# second, independent UDP protocol. Requires `std`.
audio = ["std"]

[dependencies]
rand = { version = "0.10.0", default-features = false }
tokio = { version = "1", features = ["full"], optional = true }
thiserror = { version = "2.0.19", optional = true }
socket2 = { version = "0.6.4", features = ["all"], optional = true }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", optional = true }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
async-trait = { version = "0.1.73", optional = true }
chrono = { version = "0.4.31", default-features = false, features = ["alloc"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
local-ip-address = { version = "0.6.12", optional = true }
triple_buffer = { version = "8.1.1", optional = true }
rodio = { version = "0.21.1", optional = true }
if-addrs = { version = "0.15.0", optional = true }
network-interface = { version = "2.0.3", optional = true }
audio_thread_priority = { version = "0.37.0", default-features = false, optional = true }

[dependencies.libc]
version = "0.2"
optional = true

[target.'cfg(unix)'.dependencies]
termios = "0.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winnt",
    "profileapi",
    "libloaderapi",
    "processthreadsapi",
    "iphlpapi",
    "iptypes",
    "ws2def",
    "winerror",
    "consoleapi",
    "wincon",
    "handleapi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"

# Supplies the safe `EspTaskTimerService::now()` wrapper that `platform::clock`
# uses instead of declaring `esp_timer_get_time` as a raw C symbol. Gated to the
# ESP-IDF target so its build script never runs for hosted targets. Version
# tracks the one `examples/esp32/Cargo.toml` already pins.
#
# `default-features = false` drops esp-idf-svc's default `std` and `binstart`:
# `std` would cross this crate's own `std` feature boundary, and `binstart`
# imposes a binary entry point, which a library must not do. `alloc` is not
# optional — esp-idf-svc gates `pub mod timer` behind
# `cfg(all(feature = "alloc", esp_idf_comp_esp_timer_enabled))`, so dropping it
# removes the very module this dependency is here for.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.51", default-features = false, features = ["alloc"] }

[dev-dependencies]
console-subscriber = "0.5.0"

[[example]]
name = "rusthut"
path = "examples/rusthut.rs"

[[example]]
name = "platform_demo"
path = "examples/platform_demo.rs"

[[example]]
name = "link_audio"
path = "examples/link_audio.rs"
required-features = ["audio"]

# Enforced package-wide rather than as an inner attribute in `src/lib.rs`,
# because `--all-targets` builds examples and integration tests as their own
# crates, which a `#![deny]` in the library root does not reach.
#
# This is a port of a C++ library, so the tempting shape for every
# platform-facing item is a hand-written FFI shim. Prefer a crate that already
# wraps the OS mechanism. Opting out is deliberate and reviewable: add
# `#[allow(unsafe_code)]` at the narrowest possible scope, with a comment naming
# the crates evaluated and why each was rejected.
[lints.rust]
unsafe_code = "deny"
